EVENTS:
  # --- Активные события (требуют решения игроков) ---

  - id: water_leak
    title: Протечка воды
    description: >-
      В одной из комнат через трещины в стене начала просачиваться вода.
      Чем мы можем быстро заделать протечку, чтобы не затопило нижние отсеки бункера?
    base_chance: 0.15
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -20

  - id: food_spoilage
    title: Порча запасов еды
    description: >-
      Часть продовольственных запасов покрылась плесенью, похоже, система хранения дала сбой.
      Как мы можем спасти оставшуюся еду, пока голод не стал реальной угрозой?
    base_chance: 0.10
    success_effect:
      type: food_change
      value: -1
    failure_effect:
      type: food_change
      value: -4

  - id: illness_outbreak
    title: Вспышка болезни
    description: >-
      Несколько обитателей бункера слегли с жаром и кашлем, а болезнь быстро распространяется в замкнутом пространстве.
      Как мы будем лечить заболевших и сдерживать заражение?
    base_chance: 0.10
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: generator_failure
    title: Отказ рунного генератора
    description: >-
      Рунный генератор, питающий освещение и вентиляцию, начал давать серьёзные сбои.
      Чем мы можем его починить, пока бункер не остался без света и свежего воздуха?
    base_chance: 0.10
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -25

  - id: rodent_infestation
    title: Нашествие крыс
    description: >-
      В бункер проникли крысы: они грызут провода, портят еду и разносят заразу.
      Как мы можем быстро избавиться от вредителей?
    base_chance: 0.20
    success_effect:
      type: food_change
      value: -1
    failure_effect:
      type: food_change
      value: -3

  - id: conflict_erupts
    title: Внутренний конфликт
    description: >-
      Среди обитателей бункера вспыхнула серьёзная ссора, и напряжение уже близко к драке.
      Как мы можем разрядить обстановку, пока конфликт не стал опасным для всех?
    base_chance: 0.20
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -20

  - id: air_filter_clog
    title: Засорение воздушного фильтра
    description: >-
      Система вентиляции начала давать сбои, и воздух в бункере становится спёртым и тяжёлым.
      Чем мы можем прочистить или заменить забившиеся фильтры?
    base_chance: 0.15
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -20

  - id: magic_anomaly
    title: Магическая аномалия
    description: >-
      В одном из отсеков бункера возникла нестабильная магическая аномалия, искажающая пространство и вызывающая галлюцинации.
      Как мы можем нейтрализовать её, пока она не навредила всему бункеру?
    base_chance: 0.05
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -25

  - id: water_shortage
    title: Нехватка питьевой воды
    description: >-
      Запасы питьевой воды подходят к концу быстрее, чем ожидалось.
      Как мы можем наладить добычу или очистку воды, пока жажда не стала смертельной угрозой?
    base_chance: 0.10
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: structural_damage
    title: Трещины в стенах
    description: >-
      После серии подземных толчков в нескольких стенах бункера появились глубокие трещины.
      Чем мы можем укрепить стены, чтобы свод не обрушился?
    base_chance: 0.10
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: crop_failure
    title: Крысы
    description: >-
      Крысы начали подъедать наши запасы еды через щель в стене.
      Чем мы можем от них избавиться или как заделать щель?
    base_chance: 0.20
    success_effect:
      type: food_change
      value: -1
    failure_effect:
      type: food_change
      value: -4

  - id: fire_hazard
    title: Возгорание в бункере
    description: >-
      В складском отсеке вспыхнул небольшой пожар, а в замкнутом пространстве огонь и дым особенно опасны.
      Как мы можем немедленно потушить огонь, пока пожар не распространился?
    base_chance: 0.05
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -35

  - id: morale_crisis
    title: Кризис боевого духа
    description: >-
      Долгое заключение в бункере сломило дух обитателей: депрессия и апатия лишают людей воли к выживанию.
      Как мы можем поднять моральный дух группы?
    base_chance: 0.20
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -20

  - id: theft_incident
    title: Кража запасов
    description: >-
      Кто-то тайно похищает еду и ресурсы из общих запасов, и доверие в группе уже подорвано.
      Как мы можем вычислить вора и восстановить порядок?
    base_chance: 0.20
    participants_template: random_one
    success_effect:
      type: food_change
      value: 0
    failure_effect:
      type: food_change
      value: -2

  - id: medical_emergency
    title: Тяжёлое ранение
    description: >-
      Один из обитателей бункера получил серьёзную травму во время работ: сломаны рёбра и сильное кровотечение.
      Чем мы можем помочь ему прямо сейчас, чтобы он не погиб?
    base_chance: 0.10
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -25

  - id: tunnel_collapse
    title: Обвал запасного тоннеля
    description: >-
      Запасной выход из бункера завален после обвала.
      Как мы можем расчистить тоннель, чтобы не остаться без пути к отступлению?
    base_chance: 0.20
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -15

  - id: communication_lost
    title: Потеря связи с внешним миром
    description: >-
      Магические переговорные камни перестали работать, и мы отрезаны от внешнего мира.
      Как нам восстановить связь или получить информацию о том, что происходит снаружи?
    base_chance: 0.25
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -15

  - id: poisoning
    title: Отравление воды
    description: >-
      Анализ показал, что в питьевой воде есть следы яда или токсичных веществ, и несколько человек уже чувствуют недомогание.
      Как мы можем срочно очистить воду и помочь пострадавшим?
    base_chance: 0.05
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: parasite_bloom
    title: Заражение паразитами
    description: >-
      В продовольственных запасах завелись паразиты, и несколько жителей бункера уже заражены.
      Как мы можем остановить заражение и спасти силы пострадавших?
    base_chance: 0.10
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -25

  # --- Пассивные события (происходят сами по себе) ---

  - id: lucky_find
    title: Находка в запасниках
    description: >-
      При проверке дальних отсеков обнаружен тайник с ресурсами, о котором никто не знал.
      Медикаменты, еда, инструменты — настоящее сокровище! Нужно грамотно распределить находки.
    success_effect:
      type: food_change
      value: 3

  - id: coitus
    title: Секс
    description: >-
      Среди монотонных будней бункера двое выживших нашли утешение друг в друге.
      Тепло человеческой близости подняло дух..
    participants_template: couple
    success_effect:
      type: survival_change
      value: 5

  - id: birthday_celebration
    title: День рождения
    description: >-
      Сегодня у одного из обитателей бункера день рождения! Несмотря на тяжёлые обстоятельства,
      группа решила устроить небольшое торжество. Немного радости в этой тьме.
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 3

  - id: dream_sharing
    title: Общие сны
    description: >-
      Несколько обитателей бункера рассказали друг другу сны, которые им снятся.
      Оказалось, что у многих — похожие видения. Это странным образом сблизило людей.
    participants_template: random_group
    success_effect:
      type: survival_change
      value: 2

  - id: improvised_concert
    title: Самодеятельный концерт
    description: >-
      Кто-то откопал старую гитару в кладовке. Вечер импровизированного концерта собрал всех обитателей бункера —
      люди пели, смеялись и на миг забыли о страхе.
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 4

  - id: old_photo
    title: Старая фотография
    description: >-
      Один из выживших нашёл в кармане фотографию своей семьи. Когда он показал её остальным,
      все почувствовали — за что именно они борются. Воля к выживанию окрепла.
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 3

  - id: nightmare_wave
    title: Волна кошмаров
    description: >-
      Несколько ночей подряд почти все в бункере мучаются ночными кошмарами.
      Никто толком не высыпается — усталость и тревога нарастают.
    participants_template: random_group
    success_effect:
      type: survival_change
      value: -5

  - id: argument_forgotten
    title: Примирение
    description: >-
      Два человека, которые давно не разговаривали после ссоры, неожиданно помирились.
      Атмосфера в бункере заметно потеплела.
    participants_template: couple
    success_effect:
      type: survival_change
      value: 4

  - id: ration_discovery
    title: Забытые рационы
    description: >-
      При уборке одного из дальних отсеков нашли несколько забытых упаковок с сухпайками.
      Немного, но приятно.
    participants_template: random_one
    success_effect:
      type: food_change
      value: 2

  - id: skill_training
    title: Занятие по выживанию
    description: >-
      Один из обитателей провёл импровизированное занятие — учил остальных базовым навыкам
      первой помощи и ориентирования. Группа стала немного более подготовленной.
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 3

  - id: supplies_decay
    title: Порча части запасов
    description: >-
      Из-за влажности часть запасённых материалов пришла в негодность.
      Потери небольшие, но неприятные.
    success_effect:
      type: food_change
      value: -1
