# Активное событие: есть base_chance, success_effect и failure_effect.
# Пассивное событие: без base_chance, только success_effect.
# participants_template: couple | random_one | random_group.
# Для random_group можно задать participants_min / participants_max.
# effect.type здесь обычно survival_change или food_change.
# Для survival_change value задаётся в процентах шанса выживания, для food_change - в процентах от текущего остатка еды.
# Поля title и description могут быть строкой или массивом строк.
# Для текстовых подстановок используйте {alt.some_key}, а сами наборы значений храните в alt.
# Значение ключа в alt может быть строкой или массивом строк.
# Также поддерживаются плейсхолдеры участников:
# {participant1}, {participant2}, ... и {participants}.
# Они подставляются после выбора участников события.
#
EVENT_SETTINGS:
  bunker_event_chance: 0.10
  success_chances_by_resources:
    - 0.75
    - 0.90
    - 1.00
  food_replenish:
    ratio_per_resource: 0.25
#
# Пример нового события со всеми возможными полями:
# - id: example_event
#   event_type: passive
#   title: Простое название
#   title:
#     - Неисправность систем
#     - Тревожный сигнал
#   description: >-
#     В бункере участились проблемы, а {participant1} уже пытается понять причину.
#   alt:
#     - cause:
#         - перегрузки контура
#         - старой трещины в стене
#       symptom:
#         - запах гари
#         - странный гул в трубах
#     - instrument_title: старая гитара
#       instrument: старую гитару
#   participants_template: random_group
#   participants_min: 2
#   participants_max: 4
#   base_chance: 0.15
#   success_effect:
#     type: survival_change
#     value: 10
#   failure_effect:
#     type: survival_change
#     value: -20
EVENTS:
  # --- Активные события (требуют решения игроков) ---

  - id: water_leak
    title:
      - Протечка воды
      - Утечка воды
      - Подтопление бункера
    description:
      - >-
        Началась протечка: проблема в {alt.cause}.
        Чем мы можем быстро заделать протечку, чтобы не затопило нижние отсеки бункера?
      - >-
        Из-за неполадок в {alt.cause} бункер постепенно заливает водой.
        Как нам остановить течь до того, как пострадает весь бункер?
    alt:
      - cause:
          - трещине в стене
          - водяном контуре
          - клапане подачи
    base_chance: 0.15
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -20

  - id: food_spoilage
    title:
      - Порча запасов еды
      - Плесень в запасах
      - Сбой хранения еды
    description:
      - >-
        Часть продовольственных запасов покрылась плесенью, похоже, проблема в {alt.cause}.
        Как мы можем спасти оставшуюся еду, пока голод не стал реальной угрозой?
      - >-
        Началась порча провизии: всему виной {alt.cause}.
        Что мы сделаем, чтобы сохранить хотя бы часть еды?
    alt:
      - cause:
          - сырость в помещении
          - сбой в системе хранения
          - плохая герметизация контейнеров
    base_chance: 0.10
    success_effect:
      type: food_change
      value: -10
    failure_effect:
      type: food_change
      value: -40

  - id: illness_outbreak
    title:
      - Вспышка болезни
      - Лихорадка среди выживших
      - Распространение заразы
    description:
      - >-
        Несколько обитателей слегли с жаром и кашлем, а болезнь быстро распространяется в замкнутом пространстве.
        Как мы будем лечить заболевших и сдерживать заражение?
      - >-
        Началась вспышка {alt.symptom}, и всё больше людей чувствуют недомогание.
        Чем мы изолируем очаг и поможем пострадавшим?
    alt:
      - symptom:
          - лихорадки
          - тяжёлого кашля
          - странной сыпи
    base_chance: 0.10
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: generator_failure
