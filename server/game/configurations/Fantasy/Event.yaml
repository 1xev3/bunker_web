# Активное событие: есть base_chance, success_effect и failure_effect.
# Пассивное событие: без base_chance, только success_effect.
# participants_template: couple | random_one | random_group.
# Для random_group можно задать participants_min / participants_max.
# effect.type здесь обычно survival_change или food_change, value - число.
# Поля title и description могут быть строкой или массивом строк.
# Для текстовых подстановок используйте {alt.some_key}, а сами наборы значений храните в alt.
# Значение ключа в alt может быть строкой или массивом строк.
# Также поддерживаются плейсхолдеры участников:
# {participant1}, {participant2}, ... и {participants}.
# Они подставляются после выбора участников события.
#
# Пример нового события со всеми возможными полями:
# - id: example_event
#   event_type: passive
#   title: Простое название
#   title:
#     - Неисправность систем
#     - Тревожный сигнал
#   description: >-
#     В бункере участились проблемы, а {participant1} уже пытается понять причину.
#   alt:
#     - cause:
#         - перегрузки контура
#         - старой трещины в стене
#       symptom:
#         - запах гари
#         - странный гул в трубах
#     - instrument_title: старая гитара
#       instrument: старую гитару
#   participants_template: random_group
#   participants_min: 2
#   participants_max: 4
#   base_chance: 0.15
#   success_effect:
#     type: survival_change
#     value: 10
#   failure_effect:
#     type: survival_change
#     value: -20
EVENTS:
  # --- Активные события (требуют решения игроков) ---

  - id: water_leak
    title:
      - Протечка воды
      - Утечка воды
      - Подтопление бункера
    description:
      - >-
        Началась протечка: проблема в {alt.cause}.
        Чем мы можем быстро заделать протечку, чтобы не затопило нижние отсеки бункера?
      - >-
        Из-за неполадок в {alt.cause} бункер постепенно заливает водой.
        Как нам остановить течь до того, как пострадает весь бункер?
    alt:
      - cause:
          - трещине в стене
          - водяном контуре
          - клапане подачи
    base_chance: 0.15
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -20

  - id: food_spoilage
    title:
      - Порча запасов еды
      - Плесень в запасах
      - Сбой хранения еды
    description:
      - >-
        Часть продовольственных запасов покрылась плесенью, похоже, проблема в {alt.cause}.
        Как мы можем спасти оставшуюся еду, пока голод не стал реальной угрозой?
      - >-
        Началась порча провизии: всему виной {alt.cause}.
        Что мы сделаем, чтобы сохранить хотя бы часть еды?
    alt:
      - cause:
          - сырость в помещении
          - сбой в системе хранения
          - плохая герметизация контейнеров
    base_chance: 0.10
    success_effect:
      type: food_change
      value: -1
    failure_effect:
      type: food_change
      value: -4

  - id: illness_outbreak
    title:
      - Вспышка болезни
      - Лихорадка среди выживших
      - Распространение заразы
    description:
      - >-
        Несколько обитателей слегли с жаром и кашлем, а болезнь быстро распространяется в замкнутом пространстве.
        Как мы будем лечить заболевших и сдерживать заражение?
      - >-
        Началась вспышка {alt.symptom}, и всё больше людей чувствуют недомогание.
        Чем мы изолируем очаг и поможем пострадавшим?
    alt:
      - symptom:
          - лихорадки
          - тяжёлого кашля
          - странной сыпи
    base_chance: 0.10
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: generator_failure
    title:
      - Отказ рунного генератора
      - Сбой в {alt.generator}
      - Гаснет {alt.system_name_title}
    description:
      - >-
        {alt.generator} начал давать серьёзные сбои, и под угрозой остались освещение и вентиляция.
        Чем мы можем его починить, пока бункер не остался без света и свежего воздуха?
      - >-
        Из-за неполадок в {alt.system_name_case} по отсекам уже идут перебои энергии.
        Что мы используем, чтобы восстановить питание до полной остановки систем?
    alt:
      - generator: Рунный генератор
        system_name_title: аварийное питание
        system_name_case: аварийном питании
      - generator: Главный генератор
        system_name_title: узел освещения
        system_name_case: узле освещения
      - generator: Энергетический контур бункера
        system_name_title: система вентиляции
        system_name_case: системе вентиляции
    base_chance: 0.10
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -25

  - id: rodent_infestation
    title: Нашествие крыс
    description: >-
      В бункер проникли крысы: они грызут провода, портят еду и разносят заразу.
      Как мы можем быстро избавиться от вредителей?
    base_chance: 0.20
    success_effect:
      type: food_change
      value: -1
    failure_effect:
      type: food_change
      value: -3

  - id: conflict_erupts
    title:
      - Внутренний конфликт
      - Серьёзная ссора
      - Группа на грани драки
    description:
      - >-
        Среди обитателей вспыхнула серьёзная ссора, и напряжение уже близко к драке.
        Как мы можем разрядить обстановку, пока конфликт не стал опасным для всех?
      - >-
        Из-за {alt.cause} спор быстро перерос в открытую вражду.
        Что мы сделаем, чтобы остановить эскалацию и удержать группу вместе?
    alt:
      - cause:
          - делёжки припасов
          - старых обид
          - усталости и нервного срыва
    base_chance: 0.20
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -20

  - id: air_filter_clog
    title: Засорение воздушного фильтра
    description: >-
      Система вентиляции начала давать сбои, и воздух в бункере становится спёртым и тяжёлым.
      Чем мы можем прочистить или заменить забившиеся фильтры?
    base_chance: 0.15
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -20

  - id: magic_anomaly
    title:
      - Магическая аномалия
      - Пространственное искажение
      - Рунный всплеск
    description:
      - >-
        Возникла нестабильная магическая аномалия, искажающая пространство и вызывающая галлюцинации.
        Как мы можем нейтрализовать её, пока она не навредила всему бункеру?
      - >-
        Начался рунный всплеск: воздух дрожит, стены плывут, а люди видят {alt.vision}.
        Чем мы сможем стабилизировать этот участок?
    alt:
      - vision:
          - чужие тени
          - несуществующие двери
          - мерцающие силуэты
    base_chance: 0.05
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -25

  - id: water_shortage
    title: Нехватка питьевой воды
    description: >-
      Запасы питьевой воды подходят к концу быстрее, чем ожидалось.
      Как мы можем наладить добычу или очистку воды, пока жажда не стала смертельной угрозой?
    base_chance: 0.10
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: structural_damage
    title: Трещины в стенах
    description: >-
      После серии подземных толчков в нескольких стенах бункера появились глубокие трещины.
      Чем мы можем укрепить стены, чтобы свод не обрушился?
    base_chance: 0.10
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: crop_failure
    title: Крысы
    description: >-
      Крысы начали подъедать наши запасы еды через щель в стене.
      Чем мы можем от них избавиться или как заделать щель?
    base_chance: 0.20
    success_effect:
      type: food_change
      value: -1
    failure_effect:
      type: food_change
      value: -4

  - id: fire_hazard
    title:
      - Возгорание в бункере
      - Пожар
      - Густой дым
    description:
      - >-
        В бункере вспыхнул небольшой пожар, а в замкнутом пространстве огонь и дым особенно опасны.
        Как мы можем немедленно потушить огонь, пока пожар не распространился?
      - >-
        Бункер затягивает густым дымом: загорелся {alt.source}.
        Что мы сделаем прямо сейчас, чтобы локализовать пожар?
    alt:
      - source:
          - кабельный жгут
          - стеллаж с припасами
          - ящик с горючими материалами
    base_chance: 0.05
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -35

  - id: morale_crisis
    title: Кризис боевого духа
    description: >-
      Долгое заключение в бункере сломило дух обитателей: депрессия и апатия лишают людей воли к выживанию.
      Как мы можем поднять моральный дух группы?
    base_chance: 0.20
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -20

  - id: theft_incident
    title: Кража запасов
    description: >-
      Кто-то тайно похищает еду и ресурсы из общих запасов, и доверие в группе уже подорвано.
      Как мы можем вычислить вора и восстановить порядок?
    base_chance: 0.20
    participants_template: random_one
    success_effect:
      type: food_change
      value: 0
    failure_effect:
      type: food_change
      value: -2

  - id: medical_emergency
    title:
      - Тяжёлое ранение
      - Несчастный случай
      - Срочная травма
    description:
      - >-
        Один из обитателей получил серьёзную травму во время работ: {alt.injury}.
        Чем мы можем помочь ему прямо сейчас, чтобы он не погиб?
      - >-
        Произошёл несчастный случай, и пострадавший уже теряет силы из-за {alt.injury_cause}.
        Что мы сделаем в первую очередь, чтобы его стабилизировать?
    alt:
      - injury:
          - сломаны рёбра и сильное кровотечение
          - глубокий порез и повреждённая нога
          - тяжёлый ушиб груди и потеря крови
        injury_cause:
          - сломанных рёбер и сильного кровотечения
          - глубокого пореза и повреждённой ноги
          - тяжёлого ушиба груди и потери крови
    base_chance: 0.10
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -25

  - id: tunnel_collapse
    title: Обвал запасного тоннеля
    description: >-
      Запасной выход из бункера завален после обвала.
      Как мы можем расчистить тоннель, чтобы не остаться без пути к отступлению?
    base_chance: 0.20
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -15

  - id: communication_lost
    title: Потеря связи с внешним миром
    description: >-
      Магические переговорные камни перестали работать, и мы отрезаны от внешнего мира.
      Как нам восстановить связь или получить информацию о том, что происходит снаружи?
    base_chance: 0.25
    success_effect:
      type: survival_change
      value: 10
    failure_effect:
      type: survival_change
      value: -15

  - id: poisoning
    title: Отравление воды
    description: >-
      Анализ показал, что в питьевой воде есть следы яда или токсичных веществ, и несколько человек уже чувствуют недомогание.
      Как мы можем срочно очистить воду и помочь пострадавшим?
    base_chance: 0.05
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -30

  - id: parasite_bloom
    title: Заражение паразитами
    description: >-
      В продовольственных запасах завелись паразиты, и несколько жителей бункера уже заражены.
      Как мы можем остановить заражение и спасти силы пострадавших?
    base_chance: 0.10
    participants_template: random_group
    participants_min: 2
    participants_max: 4
    success_effect:
      type: survival_change
      value: 15
    failure_effect:
      type: survival_change
      value: -25

  # --- Пассивные события (происходят сами по себе) ---

  - id: lucky_find
    title:
      - Находка в запасниках
      - Найден тайник
      - Скрытые припасы
    description:
      - >-
        Обнаружен тайник с ресурсами, о котором никто не знал.
        {alt.loot} — настоящее сокровище. Нужно грамотно распределить находки.
      - >-
        Нашлась старая заначка: {alt.loot}.
        Немного удачи в нужный момент заметно облегчило жизнь бункеру.
    alt:
      - loot:
          - Медикаменты, еда и инструменты
          - Несколько ящиков сухпайков и полезная мелочёвка
          - Консервы, бинты и рабочие детали
    success_effect:
      type: food_change
      value: 3

  - id: coitus
    title:
      - Близость
      - Личное утешение
      - Ночь тепла
    description:
      - >-
        Среди монотонных будней бункера {participant1} и {participant2} нашли утешение друг в друге.
        Тепло человеческой близости немного подняло общий дух.
      - >-
        В тесноте и напряжении {participant1} и {participant2} всё же нашли время для нежности.
        Такое напоминание о нормальной жизни неожиданно согрело всех вокруг.
    participants_template: couple
    success_effect:
      type: survival_change
      value: 5

  - id: birthday_celebration
    title:
      - День рождения
      - Маленький праздник
      - Повод улыбнуться
    description:
      - >-
        Сегодня у одного из обитателей день рождения. Несмотря на тяжёлые обстоятельства,
        группа устроила небольшое торжество. Немного радости в этой тьме.
      - >-
        Нашёлся повод улыбнуться: самодельный праздник с {alt.detail} напомнил людям,
        что жизнь в бункере не состоит только из тревоги.
    alt:
      - detail:
          - песней и тёплыми словами
          - импровизированным тортом из пайков
          - свечой и смешными историями
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 3

  - id: dream_sharing
    title:
      - Общие сны
      - Ночные видения
      - Странные совпадения во сне
    description:
      - >-
        {participants} рассказали друг другу сны, которые им снятся.
        Оказалось, что у многих повторяется {alt.vision}. Это странным образом сблизило людей.
      - >-
        После ночи разговоры крутились вокруг одного и того же сна: {alt.vision}.
        {participants} долго обсуждали это и сами не заметили, как стали ближе.
    alt:
      - vision:
          - один и тот же свет в конце тоннеля
          - одинаковый образ открытой двери наружу
          - видение тихого мира без катастрофы
    participants_template: random_group
    success_effect:
      type: survival_change
      value: 2

  - id: improvised_concert
    title:
      - Самодеятельный концерт
      - Вечер музыки
      - Нашлась {alt.instrument_title}
    description:
      - >-
        Кто-то откопал {alt.instrument} в кладовке. Вечер импровизированного концерта собрал всех обитателей —
        люди пели, смеялись и на миг забыли о страхе.
      - >-
        Внезапно устроили маленький концерт: {alt.instrument_title} снова зазвучала,
        и даже самые мрачные лица впервые за долгое время расслабились.
    alt:
      - instrument: старую гитару
        instrument_title: старая гитара
      - instrument: потрёпанную лютню
        instrument_title: потрёпанная лютня
      - instrument: походную флейту
        instrument_title: походная флейта
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 4

  - id: old_photo
    title:
      - Старая фотография
      - Напоминание о доме
      - Потёртый снимок из прошлого
    description:
      - >-
        Один из выживших нашёл в кармане {alt.memento}. Когда он показал его остальным,
        все почувствовали, за что именно они борются. Воля к выживанию окрепла.
      - >-
        Один из обитателей достал {alt.memento}, и разговоры вдруг стали очень личными.
        Память о прежней жизни заметно укрепила дух группы.
    alt:
      - memento:
          - фотографию своей семьи
          - старый снимок дома
          - выцветший портрет близких
    participants_template: random_one
    success_effect:
      type: survival_change
      value: 3

  - id: nightmare_wave
    title:
      - Волна кошмаров
      - Тревожные ночи
      - Массовая бессонница
    description:
      - >-
        Несколько ночей подряд почти все в бункере мучаются кошмарами о {alt.vision_about}.
        Никто толком не высыпается — усталость и тревога нарастают.
      - >-
        С утра разговоры только об одном: людям снова снилось, {alt.vision_dream}.
        Хроническое недосыпание делает группу всё более нервной.
    alt:
      - vision_dream:
          - будто за металлической дверью снова начался пожар
          - будто из пустых коридоров доносятся голоса
          - будто вода снова поднимается по лестнице
        vision_about:
          - затоплении бункера
          - пожаре за металлической дверью
          - голосах из пустых коридоров
    participants_template: random_group
    success_effect:
      type: survival_change
      value: -5

  - id: argument_forgotten
    title: Примирение
    description: >-
      Два человека, которые давно не разговаривали после ссоры, неожиданно помирились.
      Атмосфера в бункере заметно потеплела.
    participants_template: couple
    success_effect:
      type: survival_change
      value: 4

  - id: ration_discovery
    title:
      - Забытые рационы
      - Найдены сухпайки
      - Мелкая продовольственная находка
    description:
      - >-
        Нашли несколько забытых упаковок с сухпайками.
        Немного, но приятно.
      - >-
        Обнаружилась небольшая заначка: {alt.stash}.
        Это не роскошь, но ближайшие дни стали чуть спокойнее.
    alt:
      - stash:
          - несколько сухпайков и банок консервов
          - пара ящиков с пищевыми концентратами
