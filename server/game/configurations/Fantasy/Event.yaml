      - >-
        {alt.generator} начал давать серьёзные сбои, и под угрозой остались освещение и вентиляция.
        Чем мы можем его починить, пока бункер не остался без света и свежего воздуха?
      - >-
        Из-за неполадок в {alt.system_name_case} по отсекам уже идут перебои энергии.
        Что мы используем, чтобы восстановить питание до полной остановки систем?
    alt:
      - generator: Рунный генератор
        system_name_title: аварийное питание
        system_name_case: аварийном питании
      - generator: Главный генератор
        system_name_title: узел освещения
        system_name_case: узле освещения
      - generator: Энергетический контур бункера
        system_name_title: система вентиляции
        system_name_case: системе вентиляции
