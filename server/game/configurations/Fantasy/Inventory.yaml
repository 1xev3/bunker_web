# Предметы можно задавать двумя способами:
#  1) Плоский список строк (старый формат).
#  2) Карта категорий { категория: [предметы...] } — каждый предмет получает
#     группу с именем категории. События могут выдавать предмет нужной
#     категории: give_item: { category: medicine } / add_bunker_item: { category: repair }.
# В названиях поддерживаются варианты вида "{a|b|c}".
# BACKPACK_ITEMS: либо строка, либо [название, min, max] (min/max — целые >= 1).
#
# Канонические слаги категорий (используются и в Bunker.yaml, и в событиях):
#   medicine repair power water air food farming home comms magic
#   defense transport animals valuables navigation light dangerous
