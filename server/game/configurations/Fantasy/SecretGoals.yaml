# Секретные (скрытые) цели — чистый отыгрыш «для разнообразия».
# Выдаются игроку тайно в начале игры, на исход НЕ влияют и сервером
# не валидируются: в конце игрок сам решает, выполнил он цель или нет.
# Все цели выполняются во время основной части игры, до этапа выживания.

# Сколько игроков получат секретную цель.
# count   — точное число игроков (если игроков меньше — выдаётся всем).
# percent — доля игроков (0..1); если задан, имеет приоритет над count.
# Цели не повторяются: одному игроку — максимум одна цель.
SETTINGS:
  # count: 1
  percent: 0.333

# Список целей. Каждому выбранному игроку достаётся одна случайная.
GOALS:
  - В одном из раундов объяви себя {богом|верховным смотрителем|главным хранителем} этого бункера и уточни, что полномочия пока изучаешь.
  - Дай бункеру {нелепо торжественное имя|официальное звание} и спокойно поправляй тех, кто называет его просто бункером.
  - Назначь себе {заместителя|советника|пресс-секретаря} и хотя бы раз попроси его выступить от твоего имени по вопросу, в котором ты сам только что высказался.
  - Представь свою открытую характеристику как результат {долгой семейной традиции|секретной государственной программы|случайного, но судьбоносного решения}, о которой никто раньше не слышал.
  - После открытия характеристики другого игрока скажи «Наконец-то. Я уже начал думать, что мы зря это затеяли».
  - На полном серьёзе объясни, почему твоя профессия делает тебя естественным руководителем {очереди|комиссии по распределению стульев|процесса, который ты сам только что придумал}.
  - Заявив, что у тебя есть важный секретный предмет, в конце концов раскрой, что это что-то совершенно бесполезное.
  - Расскажи, как однажды уже попадал в похожую ситуацию, и по ходу истории добавляй всё менее правдоподобные подробности.
  - Упомяни воображаемого питомца как своего {доверенного советника|старшего по бытовым вопросам} и один раз сослись на его мнение.
  - Выбери игрока своим старым знакомым и придумай между вами общее прошлое, которое становится всё менее правдоподобным.
  - Придумай бункеру официальный девиз и вставь его в разговор с видом, будто {его знают все|его печатают на первой странице каждой инструкции|без него не обходится ни одно приличное собрание}.
  - Учреди должность «ответственного за {очевидное|паузы|непроизнесённые выводы}», назначь себя и вынеси одно официальное заключение.
  - Перед открытием своей характеристики попроси секунду тишины, а затем скажи «Ладно, достаточно».
  - Начни давать кому-нибудь совет, но в середине фразы пойми, что совет нужен тебе самому.
  - Введи в оборот несуществующий термин — например, «{предбункерная усталость|двойная готовность|обратный авось}» — и тут же объясни его так, будто он всем давно знаком.
  - Объяви перерыв, не имея на это полномочий, и сразу продолжи говорить.
  - Сам задай риторический вопрос, тут же ответь на него и поблагодари всех за конструктивный диалог.
  - Выбери незначительную деталь в рассказе игрока и отнесись к ней как к поворотному моменту своей биографии.
  - Представь, что ты пресс-секретарь самого себя, и сделай короткое заявление в третьем лице.
  - Пообещай вернуться к одной из тем позже и в конце обсуждения торжественно объяви, что возвращаешься.
  - Выбери конкретного игрока и доказывай, что его персонаж не достоин места в бункере. Каждый довод привязывай к открытой характеристике.
  - Выбери игрока, которого недооценивают, и настойчиво доказывай, что именно его персонаж нужнее остальных.
  - Придумай категоричное правило отбора по одной характеристике персонажей и отстаивай его, даже когда оно начинает работать против тебя.
  - Сравни своего персонажа с конкретным соперником по одной и той же характеристике и объясни, почему твоя версия полезнее.
  - Найди в открытой характеристике конкретного игрока слабое место и возвращайся к нему при каждом удобном случае, будто это решает судьбу всего бункера.
  - После открытия новой характеристики немедленно измени сторону и объясни, почему это только подтверждает твою прежнюю позицию.
  - До конца основной части не открывай {пол|расу|телосложение|черту характера|профессию|здоровье|хобби|фобию|инвентарь|рюкзак|дополнительную характеристику} своего персонажа. Каждый раз, когда открываешь другую, придумывай отговорку, почему эту пока рано.
  - В отыгрыше категорично доказывай, что {женщин|мужчин} не стоит брать в бункер. Каждый раз, когда довод опровергли, придумывай новый критерий отбора.
  - Отстаивай правило, что в бункер нельзя брать персонажей с профессией {целителя|мага|трактирщика|земледельца}. Подбирай аргументы на ходу и не меняй правило, даже если оно задевает тебя.
  - Убеждай остальных, что персонаж с {самой нелепой фобией|неожиданным хобби|сомнительным инвентарём} не подходит для бункера. Каждый раз цепляйся за новую деталь этой характеристики.
  - Выбери одного персонажа и доказывай, что его {профессия|здоровье|черта характера} делает его худшим кандидатом. Меняй аргументы, но не цель.
  - Придумай унизительно строгий стандарт для одной характеристики и объяви, что ему соответствуют только {люди с полезной профессией|люди без странных привычек|люди с обычным хобби}. Примени стандарт к персонажам вслух.
  - Выбери характеристику — {расу|телосложение|фобию|содержимое рюкзака|дополнительный факт} — и на полном серьёзе доказывай, что персонажей с ней нельзя брать в бункер. Критерий придумай сам.
