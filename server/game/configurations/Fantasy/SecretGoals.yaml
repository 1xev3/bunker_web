# Секретные (скрытые) цели — чистый отыгрыш «для разнообразия».
# Выдаются игроку тайно в начале игры, на исход НЕ влияют и сервером
# не валидируются: в конце игрок сам решает, выполнил он цель или нет.

# Сколько игроков получат секретную цель.
# count   — точное число игроков (если игроков меньше — выдаётся всем).
# percent — доля игроков (0..1); если задан, имеет приоритет над count.
# Цели не повторяются: одному игроку — максимум одна цель.
SETTINGS:
  count: 1
  # percent: 0.25

# Список целей. Каждому выбранному игроку достаётся одна случайная.
GOALS:
  # --- Речевые ---
  - Вставь слово «грибы» в пару предложений своих.
  - Попытайся рассказать про свою любимую игру в процессе кика.
  - Когда тебя просят открыть характеристику, сначала говоришь противоположное в ней а потом открываешь.
  - Хотя бы раз прошепчи что-то так, будто это секрет (но вслух).
  - Используй минимум три «умных» слова, значения которых сам не знаешь.
  - Вверни в разговор несуществующую поговорку и выдай за народную мудрость.
  - Хоть раз процитируй свою бабушку или дедушку.
  - Опиши свой поход в (куда то) как мега важную вещь.
  - Назови один обычный предмет слишком сложным научным термином.

  # --- Само-мифология ---
  - Заведи воображаемого питомца и упоминай его в каждом раунде.
  - Утверждай, что ты однажды видел такое в кино, по любому поводу.
  - Придумай себе прошлую профессию и упоминай её невпопад.
  - Расскажи историю про своего соседа, который (придумай сам).
  - Веди себя так, будто уже бывал в этом бункере раньше.
  - Сделай вид, что плохо слышишь одного конкретного игрока.
  - Притворись, что у тебя есть секретный предмет, которого нет.

  # --- Манера ---
  - Реагируй на всё фразой «ну это ожидаемо».
  - Делай драматическую паузу перед каждым важным словом.
  - Веди себя как экскурсовод, комментируя происходящее.
  - Каждый раз благодари того, кто только что говорил.
  - Относись к одному игроку как к давнему другу, к другому — как к знаменитости.

  # --- Мелкий абсурд ---
  - Дай бункеру имя и называй его только так.
  - Обьяви себя богом этого бункера и скажи что все должны тебя уважать в каком то из раундов.
  - Найди повод упомянуть человека, которого нет в текущей сессии.
  - Веди воображаемый счёт чего-нибудь и периодически объявляй его. (пять собак пробежало и тд)

  # --- Про ход игры ---
  - Перед открытием любой характеристики сделай вид, что тебе её жалко показывать.
  - Когда кого-то кикают, скажи прощальную речь так, будто это твой близкий друг.
  - Назначь одного игрока своим «заместителем» и спрашивай у него совета перед решениями.
  - Хотя бы раз заяви, что твоя профессия важнее, чем все думают (не уточняя почему).
  - Сделай вид, что уже знаешь, кого кикнут следующим, и намекай на это.

  # --- Про характеристики ---
  - Открывая характеристику, придумай ей пафосную предысторию. (1 раз достаточно)
  - Каждую чужую открытую характеристику комментируй так, будто видел такое раньше.
