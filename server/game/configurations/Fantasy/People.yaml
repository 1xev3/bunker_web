# Объектный синтаксис: { label, weight, groups?, severity? }
# Старый формат [значение, вес] тоже работает (без групп).
# severity — насколько болезнь критична для выживания: сколько очков
# стартового здоровья в бункере она отнимает при худшей стадии (см. HEALTH_STAGES).
# «Здоров» / без поля → 0.
HEALTH_STATES:
  - label: Здоров
    weight: 0.35
    groups: [healthy]
  - label: Диабет
    weight: 0.05
    groups: [disease, chronic]
    severity: 30
