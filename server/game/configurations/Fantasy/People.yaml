# Формат weighted-списков: [значение, вес].
# Чем больше вес, тем чаще значение выпадает.
GENDERS:
  - [Мужчина, 0.5]
  - [Женщина, 0.5]

# RACES используется отдельно от GENDERS.
RACES:
  - [Человек, 1]
  - [Орк, 0.02]
  - [Эльф, 0.02]
  - [Инопланетянин, 0.02]
  - [Эльфийка, 0.02]
  - [Крысолюд, 0.02]
  - [Существо, 0.02]
  - [Армянин, 0.02]
  - [Огр, 0.02]
  - [Гном, 0.02]
  - [Гномиха, 0.02]

GENDER_AFFIXES:
  - [Гетеросексуал, 1.5]
  - [Гомосексуал, 0.1]
  - [Бисексуал, 0.1]
  - [Асексуал, 0.1]
  - [Трансгендер, 0.1]
  - [Демифлюид-альтернативный(Долбоебка), 0.1]

# Формат возраста: [[min, max], вес].
