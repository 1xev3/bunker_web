# Формат weighted-списков: [значение, вес].
# Чем больше вес, тем чаще значение выпадает.
GENDERS:
  - [Мужчина, 0.5]
  - [Женщина, 0.5]

# Пулы для генерации ФИО (Фамилия Имя Отчество). Выбираются по полу персонажа
# (первый пол в GENDERS — мужской, второй — женский). Если секция отсутствует,
# ФИО просто не генерируется. first — имя, middle — отчество, last — фамилия.
NAMES:
  # Единый словарь фамилий. Запись — либо строка (мужская форма; женская
  # склоняется автоматически: -ов/-ин → -ова/-ина, -ский → -ская и т.д.;
  # несклоняемые вроде Тарантас/Жопадилло остаются как есть), либо пара
  # [мужская, женская] с явно заданными формами для исключений.
