# Ключ верхнего уровня: название профессии, как оно показывается в игре.
# Профессия может содержать только groups — тогда у неё нет активной способности.
# targetType: none | self | other | pair.
# effect.type: add_to_backpack | set_attribute | randomize_attribute | swap_attribute |
#   steal_attribute | strip_attribute | inspect_attribute | reveal_attribute | adjust_food.
# attribute: gender | race | body | health | hobby | phobia | inventory | additional.
# set_attribute.value: healthy | worse.
# add_to_backpack.item должен совпадать с предметом из Inventory/BACKPACK_ITEMS.
# variants используется вместо effect, если у способности есть выбор режима.
PROFESSION_ABILITIES:
  Целитель:
    groups: [medic, intellectual]
    title: Исцеляющий свет
    description: Полностью исцеляет выбранного персонажа, возвращая ему состояние «Здоров».
    targetType: other
    effect:
      type: set_attribute
      attribute: health
      value: healthy
    publicMessage: "{actor} исцелил игрока {target}."

  Рунный кузнец:
    groups: [craftsman, magic]
    title: Порча руны
    description: Накладывает порчу на снаряжение выбранного персонажа, делая его проклятым.
    targetType: other
    effect:
      type: strip_attribute
      attribute: inventory
      value: Проклят
    publicMessage: "{actor} испортил снаряжение игрока {target}."

  Наставник:
    groups: [intellectual, social]
    title: Наставление
    description: Помогает выбранному персонажу освоить новое случайное увлечение взамен прежнего.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: hobby
    publicMessage: "{actor} наставил игрока {target}."

  Рыцарь:
    groups: [fighter, military]

  Земледелец:
    groups: [farmer, provider, nature]
    title: Щедрый урожай
    description: Собирает урожай и увеличивает запас еды в бункере на одну ступень.
    targetType: none
    effect:
      type: adjust_food
      delta: 1
    publicMessage: "{actor} увеличил запас еды в бункере."

  Провидец:
    groups: [magic, scout, intellectual]
    title: Видение
    description: Тайно узнаёт одну случайную скрытую характеристику выбранного персонажа.
    targetType: other
    effect:
      type: inspect_attribute
    publicMessage: "{actor} использовал способность на игроке {target}."

  Трактирщик:
    groups: [provider, social]

  Каменщик:
    groups: [craftsman, builder]

  Маг:
    groups: [magic, intellectual]
    title: Магическая трансмутация
    description: С помощью рискованного заклинания случайным образом изменяет здоровье выбранного персонажа.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: health
    publicMessage: "{actor} поставил магический опыт над игроком {target}."

  Наездник грифона:
    groups: [military, scout, nature]
    title: Воздушная разведка
    description: С высоты замечает и раскрывает всем одну случайную скрытую характеристику выбранного персонажа.
    targetType: other
    effect:
      type: reveal_attribute
    publicMessage: "{actor} раскрыл у игрока {target} атрибут \"{revealed_label}\": {revealed_value}."

  Грозовой маг:
    groups: [magic, fighter]
    title: Удар молнией
    description: Ударом молнии оплавляет снаряжение выбранного персонажа.
    targetType: other
    effect:
      type: strip_attribute
      attribute: inventory
      value: Оплавлен
    publicMessage: "{actor} поразил молнией игрока {target}."

  Мастер водоводов:
    groups: [craftsman, builder]
    title: Закалка водой
    description: Устраивает выбранному персонажу суровую водную закалку, случайным образом меняющую его телосложение.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: body
    publicMessage: "{actor} устроил игроку {target} суровую водную процедуру."

  Исповедник:
    groups: [social, spiritual, intellectual]
    title: Исповедь
    description: Помогает выбранному персонажу избавиться от прежнего страха, но взамен тот получает новую случайную фобию.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: phobia
    publicMessage: "{actor} изменил фобию игрока {target}."

  Друид:
    groups: [magic, nature, spiritual]
    title: Зов природы
    description: Призывает силы природы, случайным образом меняя расу выбранного персонажа.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: race
    publicMessage: "{actor} вызвал изменение природы у игрока {target}."

  Алхимик:
    groups: [medic, magic, intellectual]
    title: Ядовитый эликсир
    description: Отравляет выбранного персонажа и ухудшает его здоровье.
    targetType: other
    effect:
      type: set_attribute
      attribute: health
      value: worse
    publicMessage: "{actor} применил алхимический состав на игроке {target}."

  Артефактор:
    groups: [craftsman, magic]
    title: Разбор артефакта
    description: Разбирает снаряжение выбранного персонажа, забирает полезные детали себе и оставляет разряженный предмет.
    targetType: other
    effect:
      type: steal_attribute
      attribute: inventory
      stolenValue: Разряжен
    publicMessage: "{actor} разобрал снаряжение игрока {target}."

  Бронник:
    groups: [craftsman, military]
    title: Перековка
    description: Перековывает снаряжение выбранного персонажа в другой случайный предмет.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: inventory
    publicMessage: "{actor} перековал снаряжение игрока {target}."

  Следопыт:
    groups: [scout, provider, nature]

  Ассасин:
    groups: [fighter, military]
    title: Тихое ограбление
    description: Незаметно лишает выбранного персонажа всего снаряжения.
    targetType: other
    effect:
      type: strip_attribute
      attribute: inventory
      value: Обобран
    publicMessage: "{actor} лишил игрока {target} его инвентаря."

  Теневой лазутчик:
    groups: [scout, fighter]
    title: Тайная слежка
    description: Тайно узнаёт профессию выбранного персонажа.
    targetType: other
    effect:
      type: inspect_attribute
      attribute: profession
    publicMessage: "{actor} использовал способность на игроке {target}."

  Купец:
    groups: [social, provider]
    title: Бартер
    description: Устраивает сделку и меняет местами снаряжение двух выбранных персонажей.
    targetType: pair
    effect:
      type: swap_attribute
      attribute: inventory
    publicMessage: "{actor} обменял инвентарь игроков {target1} и {target2}."

  Казначей:
    groups: [social, provider]
    title: Звон монет
    description: Подкупом меняет дополнительный факт выбранного персонажа на случайный новый.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: additional
    publicMessage: "{actor} подкупил игрока {target}."

  Зодчий:
    groups: [intellectual, builder]
    title: Чтение планов
    description: Изучает чертежи и тайно узнаёт, какое снаряжение есть у выбранного персонажа.
    targetType: other
    effect:
      type: inspect_attribute
      attribute: inventory
    publicMessage: "{actor} использовал способность на игроке {target}."

  Инквизитор:
    groups: [military, social, intellectual]
    title: Дознание
    description: Проводит дознание и раскрывает всем профессию выбранного персонажа.
    targetType: other
    effect:
      type: reveal_attribute
      attribute: profession
    publicMessage: "{actor} раскрыл у игрока {target} атрибут \"{revealed_label}\": {revealed_value}."

  Арбитр:
    groups: [social, intellectual]
    title: Приговор
    description: Оглашает приговор и раскрывает всем дополнительный факт выбранного персонажа.
    targetType: other
    effect:
      type: reveal_attribute
      attribute: additional
    publicMessage: "{actor} вынес приговор по игроку {target}: атрибут \"{revealed_label}\" — {revealed_value}."

  Разбойник:
    groups: [fighter]
    title: Налёт
    description: Грабит выбранного персонажа, забирает его снаряжение и оставляет унизительную табличку.
    targetType: other
    effect:
      type: steal_attribute
      attribute: inventory
      stolenValue: "Табличка 'лох'"
    publicMessage: "{actor} ограбил игрока {target}."

  Медовар:
    groups: [provider, social]
    title: Хмельной настой
    description: Угощает выбранного персонажа крепким настоем, случайным образом меняя его дополнительный факт.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: additional
    publicMessage: "{actor} опоил игрока {target}."

  Обольститель:
    groups: [social]
    title: Чары
    description: Накладывает чары, случайным образом меняющие пол выбранного персонажа.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: gender
    publicMessage: "{actor} повлиял на игрока {target}."

  Шут:
    groups: [social]
    title: Едкая насмешка
    description: Едкой насмешкой избавляет выбранного персонажа от прежнего страха, но порождает новую случайную фобию.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: phobia
    publicMessage: "{actor} вывел из себя игрока {target}."

  Иллюзионист:
    groups: [magic, social]
    title: Морок
    description: Запутывает воспоминания и меняет местами увлечения двух выбранных персонажей.
    targetType: pair
    effect:
      type: swap_attribute
      attribute: hobby
    publicMessage: "{actor} запутал игроков {target1} и {target2}."
