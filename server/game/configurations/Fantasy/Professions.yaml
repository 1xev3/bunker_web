# Ключ верхнего уровня: название профессии, как оно показывается в игре.
# Профессия может содержать только groups — тогда у неё нет активной способности.
# targetType: none | self | other | pair.
# effect.type: add_to_backpack | set_attribute | randomize_attribute | swap_attribute |
#   steal_attribute | strip_attribute | inspect_attribute | reveal_attribute | adjust_food.
# attribute: gender | race | body | health | hobby | phobia | inventory | additional.
# set_attribute.value: healthy | worse.
# add_to_backpack.item должен совпадать с предметом из Inventory/BACKPACK_ITEMS.
# variants используется вместо effect, если у способности есть выбор режима.
PROFESSION_ABILITIES:
  Целитель:
    groups: [medic, intellectual]
    title: Исцеляющий свет
    description: Устанавливает здоровье выбранного игрока в «Здоров».
    targetType: other
    effect:
      type: set_attribute
      attribute: health
      value: healthy
    publicMessage: "{actor} исцелил игрока {target}."

  Рунный кузнец:
    groups: [craftsman, magic]
    title: Порча руны
    description: Заменяет инвентарь выбранного игрока на «Проклят».
    targetType: other
    effect:
      type: strip_attribute
      attribute: inventory
      value: Проклят
    publicMessage: "{actor} испортил снаряжение игрока {target}."

  Наставник:
    groups: [intellectual, social]
    title: Наставление
    description: Случайно заменяет хобби выбранного игрока на другое.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: hobby
    publicMessage: "{actor} наставил игрока {target}."

  Рыцарь:
    groups: [fighter, military]

  Земледелец:
    groups: [farmer, provider, nature]
    title: Щедрый урожай
    description: Повышает запас еды в бункере на одну ступень.
    targetType: none
    effect:
      type: adjust_food
      delta: 1
    publicMessage: "{actor} увеличил запас еды в бункере."

  Провидец:
    groups: [magic, scout, intellectual]
    title: Видение
    description: Приватно узнаёт один случайный скрытый атрибут выбранного игрока.
    targetType: other
    effect:
      type: inspect_attribute
    publicMessage: "{actor} использовал способность на игроке {target}."

  Трактирщик:
    groups: [provider, social]

  Каменщик:
    groups: [craftsman, builder]

  Маг:
    groups: [magic, intellectual]
    title: Чародейский опыт
    description: Случайно меняет здоровье выбранного игрока на другое значение.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: health
    publicMessage: "{actor} поставил магический опыт над игроком {target}."

  Наездник грифона:
    groups: [military, scout, nature]
    title: Воздушная разведка
    description: Публично раскрывает один случайный скрытый атрибут выбранного игрока всем игрокам.
    targetType: other
    effect:
      type: reveal_attribute
    publicMessage: "{actor} раскрыл у игрока {target} атрибут \"{revealed_label}\": {revealed_value}."

  Грозовой маг:
    groups: [magic, fighter]
    title: Удар молнией
    description: Заменяет инвентарь выбранного игрока на «Оплавлен».
    targetType: other
    effect:
      type: strip_attribute
      attribute: inventory
      value: Оплавлен
    publicMessage: "{actor} поразил молнией игрока {target}."

  Мастер водопроводов:
    groups: [craftsman, builder]
    title: Порча водовода
    description: Случайно меняет телосложение выбранного игрока.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: body
    publicMessage: "{actor} устроил игроку {target} суровую водную процедуру."

  Исповедник:
    groups: [social, spiritual, intellectual]
    title: Исповедь
    description: Случайно заменяет фобию выбранного игрока на другую.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: phobia
    publicMessage: "{actor} изменил фобию игрока {target}."

  Друид:
    groups: [magic, nature, spiritual]
    title: Зов природы
    description: Случайно меняет расу выбранного игрока.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: race
    publicMessage: "{actor} вызвал изменение природы у игрока {target}."

  Алхимик:
    groups: [medic, magic, intellectual]
    title: Эликсир или яд
    description: Ухудшает здоровье выбранного игрока ядом.
    targetType: other
    effect:
      type: set_attribute
      attribute: health
      value: worse
    publicMessage: "{actor} применил алхимический состав на игроке {target}."

  Вор:
    groups: [craftsman, magic]
    title: Разбор артефакта
    description: "Забирает инвентарь выбранного игрока себе, тому ставит «Разряжен»."
    targetType: other
    effect:
      type: steal_attribute
      attribute: inventory
      stolenValue: Разряжен
    publicMessage: "{actor} разобрал снаряжение игрока {target}."

  Бронник:
    groups: [craftsman, military]
    title: Перековка
    description: Случайно меняет инвентарь выбранного игрока на другой предмет.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: inventory
    publicMessage: "{actor} перековал снаряжение игрока {target}."

  Следопыт:
    groups: [scout, provider, nature]

  Ассасин:
    groups: [fighter, military]
    title: Стирание следов
    description: Заменяет инвентарь выбранного игрока на «Обобран».
    targetType: other
    effect:
      type: strip_attribute
      attribute: inventory
      value: Обобран
    publicMessage: "{actor} лишил игрока {target} его инвентаря."

  Теневой лазутчик:
    groups: [scout, fighter]
    title: Тайная слежка
    description: Приватно узнаёт один случайный скрытый атрибут выбранного игрока.
    targetType: other
    effect:
      type: inspect_attribute
      attribute: profession
    publicMessage: "{actor} использовал способность на игроке {target}."

  Купец:
    groups: [social, provider]
    title: Бартер
    description: Меняет местами инвентарь двух выбранных игроков.
    targetType: pair
    effect:
      type: swap_attribute
      attribute: inventory
    publicMessage: "{actor} обменял инвентарь игроков {target1} и {target2}."

  Казначей:
    groups: [social, provider]
    title: Звон монет
    description: Случайно заменяет доп. факт выбранного игрока на другой.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: additional
    publicMessage: "{actor} подкупил игрока {target}."

  Разведчик:
    groups: [intellectual, builder]
    title: Чтение планов
    description: Приватно узнаёт один случайный скрытый атрибут выбранного игрока.
    targetType: other
    effect:
      type: inspect_attribute
      attribute: inventory
    publicMessage: "{actor} использовал способность на игроке {target}."

  Инквизитор:
    groups: [military, social, intellectual]
    title: Дознание
    description: Публично раскрывает один случайный скрытый атрибут выбранного игрока всем игрокам.
    targetType: other
    effect:
      type: reveal_attribute
      attribute: profession
    publicMessage: "{actor} раскрыл у игрока {target} атрибут \"{revealed_label}\": {revealed_value}."

  Арбитр:
    groups: [social, intellectual]
    title: Приговор
    description: Публично раскрывает один случайный скрытый атрибут выбранного игрока всем игрокам.
    targetType: other
    effect:
      type: reveal_attribute
      attribute: additional
    publicMessage: "{actor} вынес приговор по игроку {target}: атрибут \"{revealed_label}\" — {revealed_value}."

  Разбойник:
    groups: [fighter]
    title: Налёт
    description: "Забирает инвентарь выбранного игрока себе, тому ставит Табличка 'лох'."
    targetType: other
    effect:
      type: steal_attribute
      attribute: inventory
      stolenValue: "Табличка 'лох'"
    publicMessage: "{actor} ограбил игрока {target}."

  Медовар:
    groups: [provider, social]
    title: Хмельной настой
    description: Случайно заменяет доп. факт выбранного игрока на другой.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: additional
    publicMessage: "{actor} опоил игрока {target}."

  Соблазнитель:
    groups: [social]
    title: Чары
    description: Случайно меняет пол выбранного игрока.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: gender
    publicMessage: "{actor} повлиял на игрока {target}."

  Шут:
    groups: [social]
    title: Едкая насмешка
    description: Случайно заменяет фобию выбранного игрока на другую.
    targetType: other
    effect:
      type: randomize_attribute
      attribute: phobia
    publicMessage: "{actor} вывел из себя игрока {target}."

  Иллюзионист:
    groups: [magic, social]
    title: Морок
    description: Меняет местами хобби двух выбранных игроков.
    targetType: pair
    effect:
      type: swap_attribute
      attribute: hobby
    publicMessage: "{actor} запутал игроков {target1} и {target2}."
