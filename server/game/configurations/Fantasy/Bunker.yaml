# BUNKER_THEMES и BUNKER_SIZES: массив объектов с полями name и description.
BUNKER_LIFE_SETTINGS:
  initial_survival_chance: 100
  max_survival_chance: 150
  month_duration_ms: 750

BUNKER_GENERATION_SETTINGS:
  max_empty_fraction: 0.33
  max_extra_items: 3

BUNKER_THEMES:
  - name: Пробуждение древнего дракона
    description: >-
      Под Горным хребтом проснулся дракон-прародитель и выжег королевства огнём.
      Небо заволокло пеплом, караваны исчезли, а города платят дань чудовищу, чтобы дожить до утра.

  - name: Разлом магического купола
    description: >-
      Великий защитный купол над столицей треснул и выпустил наружу хаотическую магию.
      Заклинания искажаются, артефакты взрываются, а целые кварталы проваливаются в нестабильные карманы реальности.

  - name: Нашествие нежити
    description: >-
      Некромантские башни зажглись по всему материку, и мёртвые поднялись из курганов и катакомб.
      Дороги заполнены скелетами и гулями, а храмы больше не успевают освящать земли.

  - name: Война трёх корон
    description: >-
      Три великих правителя одновременно заявили права на трон и втянули весь мир в бесконечную войну.
      Замки разрушены, поля сожжены, а наёмные армии грабят всё, что ещё не успело погибнуть.

  - name: Чума чёрной луны
    description: >-
      После редкого затмения по землям прокатилась болезнь, превращающая людей в иссохших фанатиков.
      Целители бессильны, а заражённые деревни сами запирают ворота и молят богов о конце.

  - name: Падение небесного города
    description: >-
      Летающий город магов рухнул на равнины, оставив после себя кратеры, эфирные бури и россыпи опасных артефактов.
      Выжившие волшебники ведут войны за обломки древних механизмов.

  - name: Проклятие вечной зимы
    description: >-
      Северная ведьма украла лето и заковала континент в снег и лёд.
      Урожаи погибли, реки промёрзли до дна, а морозные духи охотятся на каждого, кто покидает укрытие ночью.

  - name: Вторжение из Нижнего мира
    description: >-
      В преисподней распахнулись врата, и легионы демонов хлынули в мир людей.
      Святыни осквернены, ордены паладинов несут тяжёлые потери, а выжившие прячутся от охотников за душами.

  - name: Гнев древнего леса
    description: >-
      Лесные божества пробудились и объявили войну цивилизации за века вырубок и охоты.
      Корни ломают крепости, деревья хватают путников, а звери действуют как единая разумная армия.

  - name: Бунт артефактов
    description: >-
      Зачарованные предметы по всему миру обрели волю и начали уничтожать хозяев.
      Доспехи душат рыцарей, клинки режут без приказа, а хранилища реликвий превратились в смертельные ловушки.

  - name: Пески пожрали империю
    description: >-
      Древнее проклятие пробудило пустыню, и она начала быстро расширяться, поглощая города и крепости.
      Колодцы высохли, караванные пути исчезли, а песчаные духи сбивают путников с разума.

  - name: Мор из бездны
    description: >-
      Рыбаки подняли со дна моря запечатанный идол, после чего побережье накрыли штормы и морские чудовища.
      Приливы смывают гавани, а ночами из волн выходят существа, которых нельзя убить обычной сталью.

  - name: Слом печатей титанов
    description: >-
      Семь древних печатей разрушены, и титаны снова ступили на землю.
      Их шаги вызывают землетрясения, а любая крепость рушится прежде, чем защитники успевают поднять ворота.

  - name: Охота инквизиции на магов
    description: >-
      После магической катастрофы церковь объявила всех чародеев виновными в бедствиях мира.
      Костры горят в каждом городе, знания уничтожаются, а доносы стали опаснее мечей.

  - name: Рождение кровавого бога
    description: >-
      Запретный культ завершил ритуал, и новое божество потребовало бесконечных жертв.
      Фанатики режут целые поселения, жрецы теряют рассудок, а небо каждую ночь окрашивается алым светом.

  - name: Шторм дикой магии
    description: >-
      Над землями бушуют магические грозы, меняющие законы мира на ходу.
      Люди случайно обращаются в зверей, камни вспыхивают, а простое заклинание может стереть деревню с карты.

  - name: Возвращение короля фей
    description: >-
      Правитель фейри прорвал завесу между мирами и начал забирать смертных в свои сады.
      Время течёт неправильно, дети исчезают без следа, а сделки с лесными духами стали смертельно буквальными.

  - name: Падение орд чудовищ
    description: >-
      В горах появился вождь, сумевший объединить орков, троллей и великанов под одним знаменем.
      Орды сметают заставы, осаждают города и оставляют после себя только пепел и кости.

  - name: Раскол ордена света
    description: >-
      Главный орден защитников мира раскололся на враждующие фракции и втянул государства в священную гражданскую войну.
      Каждый считает себя избранным, и никто больше не защищает обычных людей от внешней тьмы.

  - name: Сон мира заканчивается
    description: >-
      Пророки твердят, что весь мир был сном древнего существа, и оно начинает просыпаться.
      Реальность рвётся по швам, знакомые места исчезают, а сама память людей становится ненадёжной.

# ROOM_COUNTS должен быть той же длины, что и BUNKER_SIZES.
# Допустимые значения: целые числа от 1 до 25.
BUNKER_SIZES:
  - name: Маленький (50 кв.м)
    description: >-
      Тесное, но хорошо укреплённое убежище. Толстые бетонные стены надёжно защищают от внешних угроз.
      Каждый сантиметр пространства продуман до мелочей.

  - name: Средний (80 кв.м)
    description: >-
      Комфортное убежище с разделёнными зонами для сна, работы и хранения запасов.
      Собственная вентиляционная система обеспечивает чистый воздух.

  - name: Большой (120 кв.м)
    description: >-
      Просторный бункер с несколькими отсеками. Достаточно места, чтобы организовать полноценный быт.
      Система жизнеобеспечения полностью автономна.

  - name: Огромный (200 кв.м)
    description: >-
      Укреплённый комплекс с множеством зон и переходов.
      Автономная энергосистема, воздухоочиститель и дублирующие системы безопасности обеспечивают максимальную автономность.

