# BUNKER_THEMES и BUNKER_SIZES: массив объектов с полями name и description.
# Тема может опционально содержать поле image — оно показывается игрокам на
# этапе вступления (экран "Экстренное уведомление"). Значение — имя файла,
# лежащего в подпапке Images/ этого пака (например image: dragon.svg), либо
# абсолютный URL (https://...). Поддерживаются обычные форматы картинок.
BUNKER_LIFE_SETTINGS:
  month_duration_ms: 750
  food_consumption_per_player: 90

BUNKER_GENERATION_SETTINGS:
  max_empty_fraction: 0.33
  max_extra_items: 3

BUNKER_THEMES:
  - name: Пробуждение древнего {дракона|змея|вирма}
    image: theme_ancient_dragon.jpg
    description: >-
      Под {Горным хребтом|Драконьими пиками|Пепельными горами} проснулся дракон-прародитель и стёр королевства одним выдохом — целые города вспыхнули вместе с жителями, и ветер до сих пор носит запах горелого мяса.
      Те, кого не достало пламя, спеклись заживо в собственных доспехах; реки кипят, а пепел падает {как чёрный снег|жирными хлопьями|неделями без перерыва}.
      Уцелевшие деревни {отдают чудовищу первенцев|приковывают людей к скалам как подношение|сжигают своих же стариков, чтобы запах гари увёл тварь в сторону} — и всё равно каждое утро недосчитываются соседей.
      Под землёй, в темноте, слышно, как где-то наверху скребут когти размером с телегу.

  - name: Разлом магического купола
    image: theme_magic_dome_fracture.jpg
    description: >-
      Великий купол над столицей лопнул, и наружу хлынула сырая, голодная магия, которая {выворачивает плоть наизнанку|плавит кости как воск|сшивает живых в кричащие комья}.
      Целые кварталы {провалились в карманы реальности, где люди падают вечно|застыли вне времени с лицами, искажёнными ужасом|растеклись лужами того, что когда-то было семьями}.
      Маги, пытавшиеся залатать брешь, теперь бродят без кожи и без памяти, шепча имена тех, кого сами же и растворили.
      Воздух искрит, и любое неосторожное слово может превратить твоего соседа в фонтан крови.

  - name: Нашествие нежити
    image: theme_undead_invasion.jpg
    description: >-
      {Некромантские башни зажглись|Чёрные обелиски вспыхнули|Древние гробницы разверзлись} по всему материку, и мёртвые полезли из курганов — раздутые, безглазые, с обглоданными до кости пальцами.
      Они не просто убивают: {они жрут живых, начиная с лица|они утаскивают ещё дышащих под землю|они заставляют умерших родных подниматься и идти на своих же детей}.
      Дороги завалены {объедками, в которых узнаются человеческие лица|телами без нижней половины|курганами костей, обсосанных дочиста}, а от храмов остались только обугленные алтари.
      Каждый, кто умирает рядом с тобой, через час встаёт голодным.

  - name: Война {трёх корон|павших королевств|сожжённых знамён}
    image: war_three_crowns.png
    description: >-
      Три правителя залили мир кровью ради пустого трона, и война давно перестала щадить кого-либо.
      Поля удобрены трупами, колодцы забиты телами, а {наёмники|мародёры|дезертиры} вырезают деревни ради забавы и {вешают детей вдоль дорог как предупреждение|сдирают кожу с пленных и натягивают на знамёна|варят пленников живьём на глазах у их семей}.
      Когда закончилась провизия, армии начали есть павших — сначала врагов, потом своих, и теперь голод гонит их искать ещё тёплое мясо.
      Война никого не пощадит — а свежее мясо для солдат теперь ценнее золота.

  - name: Чума чёрной луны
    image: black_moon_plague.png
    description: >-
      После затмения по землям расползлась гниль, что превращает людей в {иссохших фанатиков с гноящимися ртами|безумцев, грызущих собственные руки|молчаливых тварей, что ходят на четвереньках}.
      Заражённые {вспарывают животы, ища в себе "лунного червя"|сбиваются в стаи и охотятся на здоровых|приносят детей в жертву, чтобы остановить болезнь}, и от их укуса гниль расходится за считанные часы.
      Целители давно мертвы или сами заражены; деревни {запирают ворота и режут больных вместе со здоровыми|сжигают себя заживо|роют общие ямы и сталкивают туда ещё живых}.
      В темноте бункера каждый кашель соседа звучит как приговор.

  - name: Падение небесного города
    image: skycity_fall.png
    description: >-
      Летающий город магов рухнул на равнины, размазав по земле сотни тысяч жизней и оставив кратер, где до сих пор {шевелятся изломанные тела|воют застрявшие между жизнью и смертью|растут опухоли из плоти и камня}.
      Эфирные бури {превращают дождь в кислоту, что обнажает кости|сводят людей с ума одним прикосновением|вытягивают души, оставляя пустые ходячие оболочки}.
      Выжившие волшебники грызутся за обломки артефактов и не брезгуют {скармливать слабых своим механизмам|вшивать кристаллы в живых рабов|пить кровь, чтобы питать заклинания}.
      Каждую ночь с неба продолжают падать тела тех, кто не успел спрыгнуть.

  - name: Проклятие вечной зимы
    image: eternal_winter.png
    description: >-
      Ведьма украла лето, и континент закован в лёд, под которым {вмёрзли тысячи живых с открытыми глазами|тянутся к поверхности синие руки|спят твари, что просыпаются на запах тепла}.
      Урожаи погибли в один день, и когда кончились запасы, {люди начали есть мёртвых|матери варили похлёбку из тех, кто не пережил ночь|выжившие охотятся друг на друга ради тёплой печени}.
      Морозные духи {забирают детей, что отстали хоть на шаг|вмораживают спящих в стены|поют, выманивая людей раздеться в снег и замёрзнуть с улыбкой}.
      Дрова на исходе, и холод в бункере уже добирается до костей.

  - name: Вторжение из Нижнего мира
    image: underworld_invasion.png
    description: >-
      Врата преисподней распахнулись, и демоны хлынули в мир, {сдирая кожу с целых городов|развешивая внутренности на колокольнях|превращая площади в скотобойни из людей}.
      Они не убивают быстро: {они держат жертв живыми, медленно поедая по кусочку|сшивают людей в новых тварей|заставляют родителей пожирать собственных детей под свой смех}.
      Паладины сгинули, святыни осквернены кровью, а воздух пропитан {гарью и желчью|криком, что не смолкает неделями|сладким запахом разложения}.
      Охотники за душами чуют живых сквозь камень — и они уже близко.

  - name: Гнев древнего леса
    image: ancient_forest_wrath.png
    description: >-
      Лес очнулся и объявил войну всем, кто ходит на двух ногах, за века вырубок и крови.
      Корни {прорастают сквозь спящих, выпивая их досуха|вспарывают животы и тянут кишки в землю|оплетают живых и оставляют гнить в коре}, а деревья {украшены телами, как плодами|глотают путников целиком|шепчут голосами съеденных}.
      Звери действуют как единый разум: {выедают глаза и оставляют жертв слепо бродить|сгоняют людей в овраги на убой|приносят детёнышам ещё дышащую добычу}.
      Даже под землёй сквозь стены пробиваются корни, и они ищут тепло.

  - name: Бунт артефактов
    image: artifact_revolt.png
    description: >-
      Зачарованные вещи обрели волю и обратились против хозяев с холодной, расчётливой ненавистью.
      Доспехи {сжимаются, дробя рёбра своих рыцарей|варят владельцев в собственном поту|медленно душат, наслаждаясь паникой}, клинки режут без приказа, а зеркала {показывают, как ты умрёшь, и сбываются|затягивают внутрь, оставляя кричать в стекле|крадут лица}.
      Хранилища реликвий стали бойнями, где пол {залит кровью коллекционеров|устлан обглоданными перчатками|скользкий от чего-то, что лучше не разглядывать}.
      Любой предмет в бункере может ждать, пока ты уснёшь.

  - name: Пески пожрали империю
    image: sands_devoured_empire.png
    description: >-
      Проклятие подняло пустыню, и она ползёт вперёд, погребая города вместе с живыми, что {задыхаются под тоннами песка|годами высыхают в мумии с открытыми ртами|становятся пищей для того, что роется под барханами}.
      Колодцы пересохли, и от жажды люди {пьют кровь верблюдов, а потом друг друга|режут попутчиков ради влаги в их телах|сходят с ума и закапываются заживо}.
      Песчаные духи {носят голоса погибших семей|сдирают плоть ветром до белых костей|заводят караваны в круг, пока те не падут и не сгниют стоя}.
      Песок уже сыплется сквозь щели бункера, тихо и неотвратимо.

  - name: Мор из бездны
    image: abyssal_plague.png
    description: >-
      Рыбаки подняли со дна запечатанный идол, и побережье захлестнули твари, у которых {слишком много ртов|человеческие зубы в неправильных местах|лица утонувших на чешуе}.
      По ночам из волн выходят существа, которые {утаскивают спящих целыми семьями|оставляют на берегу обглоданные скелеты в рыбацких сетях|откладывают что-то живое под кожу пойманных}.
      Заражённая вода {превращает выпивших в безротых утопленников|растворяет плоть до костей|зовёт людей войти в море и не вернуться}.
      Сырость в бункере пахнет солью и гнилой рыбой, и по ночам в трубах что-то ворочается.

  - name: Слом печатей титанов
    image: titan_seals_broken.png
    description: >-
      Семь печатей пали, и титаны вернулись — каждый их шаг давит деревни в кровавую кашу, а крепости рушатся прежде, чем успевают захлопнуть ворота.
      Они {собирают людей в кулаки и выжимают, как виноград|насаживают живых на сломанные башни|жуют толпы и выплёвывают кости}.
      Земля трескается, и из разломов {лезут твари поменьше, что доедают раздавленных|поднимается жар, варящий людей в укрытиях|тянет тех, кто не успел убежать}.
      Своды бункера дрожат от далёких шагов, и с потолка сыплется пыль.

  - name: Охота инквизиции на магов
    image: inquisition_witch_hunt.png
    description: >-
      Церковь объявила всех чародеев виновными, и теперь костры не гаснут ни днём, ни ночью.
      Инквизиторы {вырывают признания вместе с ногтями|варят подозреваемых в освящённом масле|сжигают целые семьи за один донос}, а толпы {забивают камнями детей "с дурным глазом"|вешают соседей ради их добра|жгут всех, кто посмел выжить слишком удачно}.
      Доносы стали смертоноснее мечей: достаточно взгляда, чтобы оказаться на дыбе.
      В бункере любой, кто кажется "не таким", рискует не дожить до утра — свои страшнее чудовищ.

  - name: Рождение кровавого бога
    image: blood_god_birth.png
    description: >-
      Культ завершил ритуал, и новорождённое божество требует крови без конца и меры.
      Фанатики {вырезают деревни от младенцев до стариков|свежуют жертв заживо на алтарях|сшивают людей в живые жертвенные ковры}, и небо каждую ночь {течёт алым|плачет тёплой кровью|гудит от воплей}.
      Жрецы давно потеряли рассудок и {пьют из чаш, полных глаз|носят кожу прихожан как облачение|умоляют, чтобы их съели первыми}.
      Бог уже знает, что в бункере бьются живые сердца, и он голоден.

  - name: Шторм дикой магии
    image: wild_magic_storm.png
    description: >-
      Над землями бушуют магические грозы, что переписывают законы мира на лету и {выворачивают людей наизнанку|сплавляют толпы в единое кричащее существо|превращают кости в стекло}.
      Один разряд — и человек {обращается в зверя, что жрёт свою семью|растекается лужей, всё ещё в сознании|вспыхивает изнутри}.
      Деревни исчезают за миг, оставляя {тени на стенах|дождь из крови|поля оплавленных силуэтов, застывших в беге}.
      Магия просачивается даже под землю, и никто не знает, чем обернётся следующий вдох.

  - name: Возвращение короля фей
    image: fae_king_return.png
    description: >-
      Король фейри прорвал завесу и забирает смертных в свои сады, откуда {возвращаются пустые куклы из коры и зубов|не возвращается никто|приходят чужие твари в лицах пропавших}.
      Время сошло с ума, дети исчезают из колыбелей, а сделки стали смертельно буквальными: {за песню платят кожей|за ночлег — годами жизни|за имя — собственным лицом}.
      Тех, кто нарушил слово, фейри {выворачивают суставы наизнанку и сажают в клумбы|подвешивают в кронах, живых и поющих|скармливают своим гончим по кусочку}.
      По ночам у дверей бункера слышен детский смех, хотя детей здесь нет.

  - name: Падение орд чудовищ
    image: monster_horde.png
    description: >-
      В горах поднялся вождь, объединивший орков, троллей и великанов, и его орды катятся по миру, не оставляя живых.
      Они {нанизывают пленных на колья вдоль дорог|разделывают людей, как скот, и коптят впрок|заставляют сдавшихся смотреть, как едят их семьи}.
      После них остаются {частоколы из голов|кострища с человеческими костями|поля, где валяются обглоданные дочиста тела}.
      Орда движется на запах дыма и страха — а бункер пахнет и тем, и другим.

  - name: Раскол ордена света
    image: order_of_light_schism.png
    description: >-
      Орден защитников раскололся, и святая война пожирает мир изнутри, страшнее любой внешней тьмы.
      Каждая фракция считает остальных еретиками и {сжигает целые города ради "очищения"|пытает пленных во имя света|режет детей, чтобы те "не выросли во грехе"}.
      Бывшие герои {украшают стены кишками отступников|топят деревни в крови во имя добра|освящают клинки на живых людях}.
      Обычных людей больше никто не защищает — их используют как топливо для чужой праведности.

  - name: Сон мира заканчивается
    image: world_dream_ends.png
    description: >-
      Пророки твердят, что мир — лишь сон древней твари, и она просыпается, унося реальность с собой.
      Знакомые места {исчезают вместе с людьми, будто их и не было|выворачиваются в коридоры из плоти|заполняются теми, у кого нет лиц}.
      Память рвётся: люди {забывают, как дышать|узнают в близких чужаков и убивают их|растворяются, пока кто-то о них помнит, и потом исчезают совсем}.
      Стены бункера иногда становятся мягкими и тёплыми, как изнутри чего-то живого, и ты уже не уверен, что всё ещё бодрствуешь.

# ROOM_COUNTS должен быть той же длины, что и BUNKER_SIZES.
# Допустимые значения: целые числа от 1 до 25.
BUNKER_SIZES:
  - name: Маленький (50 кв.м)
    description: >-
      Тесное, но хорошо укреплённое убежище. Толстые бетонные стены надёжно защищают от внешних угроз.
      Каждый сантиметр пространства продуман до мелочей.

  - name: Средний (80 кв.м)
    description: >-
      Комфортное убежище с разделёнными зонами для сна, работы и хранения запасов.
      Собственная вентиляционная система обеспечивает чистый воздух.

  - name: Большой (120 кв.м)
    description: >-
      Просторный бункер с несколькими отсеками. Достаточно места, чтобы организовать полноценный быт.
      Система жизнеобеспечения полностью автономна.

  - name: Огромный (200 кв.м)
    description: >-
      Укреплённый комплекс с множеством зон и переходов.
      Автономная энергосистема, воздухоочиститель и дублирующие системы безопасности обеспечивают максимальную автономность.

BUNKER_DURATIONS:
  - [2 года, 24]
  - [3 года, 36]
  - [5 лет, 60]
  - [7 лет, 84]

FOOD_SUPPLIES:
  - name: Очень мало еды
    amount: 540
  - name: Мало еды
    amount: 1080
  - name: Достаточно еды
    amount: 2160
  - name: Много еды
    amount: 4320
  - name: Стратегический запас
    amount: 8640

ROOM_COUNTS:
  - 3
  - 5
  - 7
  - 9

BUNKER_ITEMS:
  - Медицинское круги магии
  - Система фильтрации воды магией
  - Система очистки воздуха магией
  - Рунный генератор
  - Оружейная комната
  - Библиотека
  - Алхимическая лаборатория
  - Теплица для выращивания растений
  - Зал кристальной связи
  - Стеллажи с магическими фолиантами
  - Запас медикаментов
  - Мастерская
  - Инструменты для ремонта
  - Запчасти для техники
  - Удобные кровати
  - Спортивный зал
