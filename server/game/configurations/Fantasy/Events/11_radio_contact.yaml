# Сквозь шёпот говорящего камня прорывается чей-то голос. Ответить — надежда на
# спасение или приманка разбойников. Выбор тянет за собой долгую цепочку
# последствий.
events:
  - id: radio_signal
    type: choice
    weight: 1
    when:
      min_month: 2
      min_players: 2
      flag_unset: [radio_answered]
    participants:
      operator: {}
    vars:
      voice: "{хриплый мужской голос|далёкий женский голос|нараспев читаемая считалка|обрывки чьей-то молитвы}"
    title: Голос в камне
    text: >-
      Сквозь треск и помехи говорящий камень донёс до {operator} чужой зов —
      {event.voice}. Кто-то живой, совсем рядом. Откликнуться и выдать своё
      убежище — или промолчать и остаться в безопасной тишине?
    options:
      - id: answer
        label: Откликнуться
        description: Назваться и договориться о встрече. Вдруг это спасение.
        effects:
          - { on: all, sanity: 5 }
          - { flag: { radio_answered: true } }
        schedule:
          - { event: convoy_arrives, in: 2, chance: 55, carry: [operator] }
          - { event: raiders_arrive, in: 2, chance: 45, carry: [operator] }
      - id: listen
        label: Только слушать
        description: Не выдавать себя, но не упускать чужой зов.
        outcomes:
          - chance: 60
            text: Голос ещё несколько ночей звал в пустоту, а потом смолк навсегда.
            effects:
              - { on: operator, sanity: -6 }
              - { on: others, sanity: -2 }
          - text: По обрывкам речей удалось понять, где безопаснее добывать припасы.
            effects:
              - { food: 100 }
              - { on: all, sanity: 3 }
      - id: smash
        label: Заглушить камень
        description: Меньше знаешь — крепче спишь. Оборвать связь совсем.
        effects:
          - { on: operator, sanity: -8 }
          - { on: all, sanity: -3 }

  - id: convoy_arrives
    type: choice
    scheduled_only: true
    title: Гости снаружи
    text: >-
      Те, с кем {operator} вышел на связь, добрались до ворот — небольшой обоз
      выживших с поклажей. Они просятся внутрь и сулят поделиться.
    options:
      - id: welcome
        label: Впустить
        description: Разделить кров и припасы — вместе выжить легче.
        effects:
          - { food: 200 }
          - { on: all, sanity: 8 }
          - { add_room: true }
      - id: trade_only
        label: Только сменять
        description: На порог не пускать, но обменяться у ворот.
        effects:
          - { food: 120 }
          - { on: operator, sanity: 4 }
      - id: turn_away
        label: Прогнать
        description: Лишние рты ни к чему. Захлопнуть ворота.
        effects:
          - { on: all, sanity: -6 }
          - { on: operator, status: { id: guilt, label: Чувство вины, stat: sanity, value: -4, months: 3 } }

  - id: raiders_arrive
    type: choice
    scheduled_only: true
    when:
      flag_unset: [raid_survived]
    title: На зов пришли разбойники
    text: >-
      Зов {operator} услышали не те, кого ждали: к воротам вышла вооружённая
      ватага и колотит в дверь, требуя впустить и отдать запасы.
    select:
      kind: profession
      prompt_profession: Кто организует оборону?
    options:
      - id: defend
        label: Держать оборону
        description: Забаррикадироваться и встретить незваных гостей.
        requires: [profession]
        outcomes_by_selection:
          all:
            - text: Под умелым началом оборону держали крепко — разбойники отступили ни с чем.
              effects:
                - { on: all, sanity: 6 }
                - { flag: { raid_survived: true } }
          none:
            - chance: 40
              text: Отбились, но дорогой ценой — есть раненые.
              effects:
                - { on: random, health: -20 }
                - { on: all, sanity: -4 }
                - { flag: { raid_survived: true } }
            - text: Без толкового командира оборона рассыпалась — разбойники ворвались внутрь.
              effects:
                - { on: random, kill: true }
                - { food: "40%" }
                - { on: all, sanity: -10 }
      - id: pay_off
        label: Откупиться
        description: Отдать часть припасов, лишь бы ушли без крови.
        effects:
          - { food: "35%" }
          - { on: all, sanity: -5 }
          - { flag: { raid_survived: true } }
