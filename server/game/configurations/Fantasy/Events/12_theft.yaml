# Кто-то таскает из общих запасов по ночам. Поймать вора, устроить слежку или
# спустить на тормозах — и жить с последствиями.
events:
  - id: night_thief
    type: choice
    weight: 1
    when:
      min_month: 1
      min_players: 3
    participants:
      thief: {}
    vars:
      missing: "{паёк|солонина|снадобья|бурдюк воды}"
    title: Ночной вор
    text: >-
      Утром недосчитались: пропал {event.missing}. Кто-то ворует у своих под
      покровом сна, и подозрение расползается по убежищу быстрее голода.
    options:
      - id: stake_out
        label: Устроить засаду
        description: Не спать ночь и подкараулить вора с поличным.
        outcomes:
          - chance: 65
            text: На рассвете {thief} попался у кладовой с чужим пайком в руках.
            effects:
              - { on: thief, sanity: -8 }
            schedule:
              - { event: thief_caught, in: 1, carry: [thief] }
          - text: Ночь прошла впустую — вор не показался, а люди вымотались.
            effects:
              - { on: all, health: -3, sanity: -4 }
      - id: lock_up
        label: Запереть кладовую
        description: Повесить замок и выдавать паёк только при всех.
        effects:
          - { on: all, sanity: -3 }
          - { flag: { storage_locked: true } }
      - id: ignore
        label: Закрыть глаза
        description: Не сеять раздор — пусть совесть сама накажет.
        outcomes:
          - chance: 50
            text: Кражи прекратились сами собой — видно, вору стало стыдно.
            effects:
              - { on: all, sanity: 1 }
          - text: "Безнаказанность развязала руки: запасы продолжили таять, а {thief} прибрал к рукам чужое — {item}."
            effects:
              - { food: "20%" }
              - { on: all, sanity: -5 }
              - { steal_item: { from: others, to: thief } }

  - id: thief_caught
    type: choice
    scheduled_only: true
    title: Вор пойман
    text: >-
      {thief} стоит перед всеми, пряча глаза. Вина доказана — теперь убежищу
      решать, что с этим делать.
    options:
      - id: hear_out
        label: Выслушать наедине
        description: Поговорить без чужих ушей — может, за этим что-то стоит.
        outcomes:
          - chance: 50
            effects:
              - { on: thief, sanity: 8 }
              - { on: others, sanity: 3 }
              - { on: thief, status: { id: indebted, label: В долгу перед всеми, stat: sanity, value: -2, months: 2 } }
          - effects:
              - { on: thief, sanity: -6 }
              - { on: others, sanity: -5 }
              - { food: -40 }
      - id: public_shame
        label: Объявить прилюдно
        description: Пусть все знают — тайное всегда выходит наружу.
        outcomes:
          - chance: 55
            text: "Под общим напором {thief} вернул припрятанное — {item} вернулось хозяевам."
            effects:
              - { on: thief, health: -8, sanity: -8 }
              - { on: others, sanity: 5 }
              - { steal_item: { from: thief, to: others } }
          - effects:
              - { on: thief, health: -14, sanity: -14 }
              - { on: others, sanity: -4 }
              - { on: thief, status: { id: broken, label: Надломлен, stat: health, value: -3, months: 2 } }
      - id: open_vote
        label: Отдать на суд всем
        description: Пусть каждый скажет слово — это дело общее.
        outcomes:
          - chance: 35
            effects:
              - { on: all, sanity: 4 }
          - chance: 40
            effects:
              - { on: thief, health: -10, sanity: -10 }
              - { on: others, sanity: 2 }
          - effects:
              - { on: thief, kill: true }
              - { on: all, sanity: -8 }
              - { on: random, status: { id: haunted, label: Тяжёлая память, stat: sanity, value: -3, months: 3 } }
