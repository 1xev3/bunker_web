# Вещий кошмар, разошедшийся по убежищу. Если человеку не помочь, дело может
# дойти до настоящего срыва — вплоть до гибели.
events:
  - id: shared_nightmare
    type: choice
    weight: 2
    when:
      min_month: 1
      min_players: 2
    participants:
      dreamer: {}
    vars:
      vision: "{горящий город|лица погибших|бесконечный тёмный коридор|поднимающуюся к горлу скверну}"
    title: Вещий кошмар
    text: >-
      {dreamer} проснулся с криком — снова {event.vision}. Тяжёлый сон будто
      перетёк к остальным: к утру всё убежище разбито и взвинчено. Как поступить
      с {dreamer}?
    select:
      kind: profession
      prompt_profession: Кто попробует успокоить?
    options:
      - id: comfort
        label: Успокоить
        description: Найти того, кто умеет говорить с людьми, и привести {dreamer} в чувство.
        requires: [profession]
        outcomes_by_selection:
          all:
            - text: Тихий разговор до самого утра — и {dreamer} наконец отпустило.
              effects:
                - { on: dreamer, health: 5, sanity: 15 }
                - { on: others, sanity: 5 }
          none:
            - chance: 45
              text: Кое-как уговорили {dreamer} поспать, но осадок остался.
              effects:
                - { on: dreamer, health: -5, sanity: -10 }
                - { on: others, sanity: -4 }
            - text: Нужных слов не нашлось — {dreamer} замкнулся в себе совсем.
              effects:
                - { on: dreamer, health: -10, sanity: -18 }
                - { on: dreamer, status: { id: insomnia, label: Бессонница, stat: sanity, value: -5, months: 2 } }
                - { on: others, health: -5, sanity: -8 }
              schedule:
                - { event: breaking_point, in: 1, chance: 65, carry: [dreamer] }
      - id: ignore
        label: Не обращать внимания
        description: У каждого свои кошмары — пусть справляется сам. Может, обойдётся.
        outcomes:
          - chance: 20
            text: "{dreamer} отоспался сам и к утру был как новенький — морок отступил, и убежище выдохнуло вместе с ним."
            effects:
              - { on: dreamer, health: 5, sanity: 12 }
              - { on: others, sanity: 5 }
          - text: Без поддержки кошмар вымотал {dreamer} вконец, и тревога расползлась по убежищу.
            effects:
              - { on: dreamer, health: -12, sanity: -18 }
              - { on: others, health: -5, sanity: -8 }
            schedule:
              - { event: breaking_point, in: 1, chance: 60, carry: [dreamer] }

  - id: breaking_point
    type: choice
    scheduled_only: true
    title: На грани
    text: >-
      Недосып и страх доконали {dreamer}: руки трясутся, взгляд пустой, речь
      бессвязная. Ещё немного — и человек сломается совсем.
    select:
      kind: item
      prompt_item: Чем поддержать?
    options:
      - id: treat
        label: Отпоить снадобьем
        description: Потратить что-то из запасов, чтобы вытащить {dreamer}.
        requires: [item]
        consume_items: true
        effects:
          - { on: dreamer, health: 8, sanity: 18, clear_status: debuffs }
          - { on: others, sanity: 4 }
      - id: let_be
        label: Оставить как есть
        description: Запасы не резиновые — будь что будет.
        outcomes:
          - chance: 40
            text: "{dreamer} медленно пришёл в себя, но прежним уже не стал."
            effects:
              - { on: dreamer, health: -15, sanity: -12 }
              - { on: others, sanity: -5 }
          - text: Рассудок {dreamer} не выдержал — сердце остановилось во сне.
            effects:
              - { on: dreamer, kill: true }
              - { on: others, health: -5, sanity: -18 }
