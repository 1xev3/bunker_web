# Гриб-великан в подземелье — съесть сразу, исследовать или посеять споры.
events:
  - id: giant_mushroom
    type: choice
    weight: 1
    when:
      flag_unset: [giant_mushroom_found]
    title: Гриб-великан
    text: >-
      В дальнем углу подземелья вырос гриб размером с человека. По виду и запаху —
      съедобный, и явно с магическим привкусом. Такая находка может обеспечить
      запасами на недели, но с чем именно они столкнулись, пока непонятно.
    options:
      - id: eat_it
        label: Пустить на еду
        description: Срезать и засолить прямо сейчас — долго не ждать.
        outcomes:
          - chance: 75
            text: >-
              Гриб оказался сочным и питательным. Несколько дней ели от пуза —
              давно такого не было.
            effects:
              - { food: 900 }
              - { on: all, health: 8, sanity: 12 }
              - { flag: { giant_mushroom_found: true } }
          - text: >-
              Вкусно, но с непривычки у многих расстроился желудок. Зато сыты —
              и это уже немало.
            effects:
              - { food: 850 }
              - { on: all, health: -6, sanity: 6 }
              - { flag: { giant_mushroom_found: true } }
      - id: study_first
        label: Сначала исследовать
        description: Проверить — вдруг у гриба полезные магические свойства.
        outcomes:
          - chance: 55
            text: >-
              Внутри обнаружили целебные споры. Из части приготовили настойку,
              остальное пошло в котёл. И сытно, и на пользу здоровью.
            effects:
              - { food: 300 }
              - { on: all, health: 18, sanity: 14 }
              - { flag: { giant_mushroom_found: true } }
          - text: >-
              Ничего особенного не нашли — просто большой гриб. Пустили на еду
              без лишних церемоний.
            effects:
              - { food: 285 }
              - { on: all, sanity: 8 }
              - { flag: { giant_mushroom_found: true } }
      - id: cultivate
        label: Посеять споры
        description: Срезать часть, а споры пустить в грибную ферму — вложение в будущее.
        effects:
          - { food: 70 }
          - { on: all, sanity: 10 }
          - { flag: { giant_mushroom_found: true } }
        schedule:
          - { event: mushroom_harvest, in: 4, chance: 80 }

  - id: mushroom_harvest
    type: flavor
    scheduled_only: true
    title: Урожай грибов
    text: >-
      Посеянные споры дали обильный урожай. Грибная ферма теперь производит
      вдвое больше обычного — лучшее вложение за последние месяцы.
    effects:
      - { food: 1600 }
      - { on: all, health: 5, sanity: 12 }
