id: water_shortage
title:
  - Нехватка питьевой воды
  - Пустые канистры
  - Быстро тают запасы воды
description:
  - >-
    Запасы питьевой воды подходят к концу быстрее, чем ожидалось: {alt.reason}.
    Как мы можем наладить добычу или очистку воды, пока жажда не стала
    смертельной угрозой?
  - >-
    После {alt.reason_case} в резервуарах осталось тревожно мало воды.
    Что мы сделаем, чтобы группа не осталась без питья в ближайшие дни?
alt:
  - reason:
      - фильтры работают хуже обычного
      - часть резервуаров оказалась пустой
      - расход воды резко вырос
    reason_case:
      - сбоя в фильтрации
      - неожиданно высокого расхода
      - потери части резервуаров
base_chance: 0.10
success_effects:
  - type: survival_change
    value: 15
failure_effects:
  - type: survival_change
    value: -30
