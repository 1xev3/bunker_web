id: supplies_decay
title:
  - Порча части запасов
  - Сырость и потери
  - Потери на складе
description:
  - >-
    Из-за {alt.cause} часть запасённых материалов пришла в негодность.
    Потери небольшие, но неприятные.
  - >-
    На складе обнаружили последствия {alt.cause}: пострадали {alt.supplies}.
    Удар не критичный, но очень досадный.
alt:
  - cause:
      - сырости и плесени
      - конденсата на стенах
      - плохой герметизации контейнеров
    supplies:
      - часть припасов
      - упаковки с провизией
      - мешки с сухими запасами
success_effects:
  - type: food_change
    value: -10
