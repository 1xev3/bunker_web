# Говорящий архив транслирует что-то сам по себе — флейвор, потом развилка.
events:
  - id: archive_voice
    type: flavor
    weight: 1
    when:
      min_players: 2
      flag_unset: [archive_voice_resolved]
    participants:
      listener: {}
    vars:
      phrase:
        - "\"Вы не последние\""
        - "\"Ключ под третьей плитой\""
        - "\"Не открывайте северный ход\""
        - "\"Счётчик идёт назад\""
    title: Голос из архива
    text: >-
      {listener} услышал, как Говорящий архив — обычно молчаливый — сам
      по себе произнёс: {event.phrase}. Никто из остальных не был рядом,
      и теперь трудно сказать, привиделось ли это.
    effects:
      - { on: listener, health: -5, sanity: -12 }
      - { on: all, sanity: -5 }
    schedule:
      - { event: archive_decision, in: 1, carry: [listener] }

  - id: archive_decision
    type: choice
    scheduled_only: true
    title: Что делать с голосом из архива?
    text: >-
      {listener} рассказал остальным. Архив по-прежнему молчит, но некоторые
      прикладывают ухо к его поверхности и клянутся, что слышат дыхание.
    options:
      - id: archive_investigate
        label: Проверить слова архива
        description: Последовать подсказке буквально — вдруг в ней правда.
        outcomes:
          - chance: 40
            text: Нашли. За третьей плитой был запас, о котором все забыли.
            effects:
              - { food: 140 }
              - { on: all, health: 5, sanity: 10 }
              - { flag: { archive_voice_resolved: true } }
          - text: Ничего не нашли. Пока искали, убежище без присмотра — кто-то пострадал.
            effects:
              - { on: all, health: -12, sanity: -12 }
              - { on: random, health: -15 }
              - { flag: { archive_voice_resolved: true } }
      - id: archive_seal
        label: Отключить архив
        description: Слишком тревожно — лучше заглушить это.
        effects:
          - { on: all, sanity: -4 }
          - { on: listener, sanity: -10 }
          - { flag: { archive_voice_resolved: true } }
      - id: archive_talk_back
        label: Заговорить с ним
        description: Ответить архиву — может, он ждёт диалога.
        outcomes:
          - chance: 30
            text: >-
              Архив ответил. Что именно — {listener} не стал пересказывать,
              но выглядел потрясённым и спал крепче остальных.
            effects:
              - { on: listener, health: 8, sanity: 22 }
              - { on: others, sanity: -6 }
              - { flag: { archive_voice_resolved: true } }
          - text: Тишина. Только эхо. А {listener} с тех пор не разговаривает.
            effects:
              - { on: listener, health: -15, sanity: -25 }
              - { on: all, health: -5, sanity: -10 }
              - { flag: { archive_voice_resolved: true } }
