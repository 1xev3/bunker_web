events:
  - id: homunculus_emerges
    type: flavor
    weight: 1
    when:
      min_players: 2
      flag_unset: [homunculus_resolved]
    participants:
      finder: {}
    vars:
      origin:
        - "за трубами теплообменника"
        - "в замурованной нише под лестницей"
        - "внутри пустого котла на кухне"
        - "под сломанным верстаком в мастерской"
        - "в щели между стеной и баком с водой"
    title: Нечто из темноты
    text: >-
      {finder} заметил движение {event.origin}. Оттуда выбралось существо
      размером с кошку — тёплое, с человеческими глазами. Оно посмотрело прямо
      на {finder} и не убежало. Откуда оно взялось — непонятно: ничего подобного
      в бункере раньше не было.
    effects:
      - { on: finder, sanity: -12 }
      - { on: all, sanity: -5 }
    schedule:
      - { event: homunculus_dilemma, in: 1, carry: [finder] }

  - id: homunculus_dilemma
    type: choice
    scheduled_only: true
    title: Существо никуда не уходит
    text: >-
      К утру существо обосновалось в углу общего отсека. Оно не агрессивно,
      но смотрит на каждого входящего. {finder} говорит, что оно явно понимает,
      о чём говорят рядом. Нужно что-то решить.
    options:
      - id: homunculus_feed
        label: Покормить и оставить
        description: Дать ему еды — пусть живёт, если не мешает.
        outcomes:
          - chance: 55
            effects:
              - { on: all, health: 4, sanity: 8 }
              - { food: -20 }
              - { flag: { homunculus_resolved: true } }
          - effects:
              - { on: all, sanity: -8 }
              - { food: -70 }
              - { flag: { homunculus_resolved: true } }
        schedule:
          - { event: homunculus_guardian, in: 2, chance: 40 }

      - id: homunculus_observe
        label: Не трогать, понаблюдать
        description: Подождать — может, само станет ясно, опасно оно или нет.
        outcomes:
          - chance: 45
            effects:
              - { on: all, sanity: -4 }
              - { flag: { homunculus_resolved: true } }
          - effects:
              - { on: all, health: -5, sanity: -10 }
              - { flag: { homunculus_resolved: true } }
        schedule:
          - { event: homunculus_leaves_quiet, in: 2, chance: 55 }

      - id: homunculus_expel
        label: Выставить за дверь
        description: Снаружи его проблемы, не наши.
        outcomes:
          - chance: 60
            effects:
              - { on: finder, health: -5, sanity: -8 }
              - { on: others, sanity: -5 }
              - { flag: { homunculus_resolved: true } }
          - effects:
              - { on: all, health: -7, sanity: -14 }
              - { flag: { homunculus_resolved: true } }
        schedule:
          - { event: homunculus_returns, in: 2, chance: 35 }

  - id: homunculus_guardian
    type: flavor
    scheduled_only: true
    title: Необычный сосед
    text: >-
      Существо освоилось. Оно таскает мелкий мусор от входа, складывает инструменты
      по местам — будто отплачивает за еду. Несколько раз будило дежурного, когда
      в коридоре что-то двигалось. Непонятно, кто оно такое, но стало частью бункера.
    effects:
      - { on: all, health: 6, sanity: 10 }
      - { food: 50 }

  - id: homunculus_leaves_quiet
    type: flavor
    scheduled_only: true
    title: Исчезновение
    text: >-
      Существа больше нет. Ни следа, ни запаха — только примятая ветошь в углу,
      где оно спало. Дверь заперта изнутри. Как оно вышло — никто не понимает.
    effects:
      - { on: all, sanity: -8 }

  - id: homunculus_returns
    type: flavor
    scheduled_only: true
    title: Оно вернулось
    text: >-
      Ночью кто-то услышал царапанье у двери. Существо стоит снаружи —
      исхудавшее, с ранами. Смотрит в щель и молчит. Его выгнали, но оно выжило.
      Теперь все это знают.
    effects:
      - { on: all, health: -8, sanity: -18 }
