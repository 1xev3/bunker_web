# Эвент + цепочка нарративов
- id: mad_survivor
  title:
    - Срыв
    - Кто-то сломался
    - Нервы на пределе
  description:
    - >-
      {participant1} сорвался: угрожает другим, кричит, ведёт себя непредсказуемо.
      Как мы усмирим его до того, как ситуация выйдет из-под контроля?
    - >-
      После долгих недель в изоляции {participant1} больше не контролирует себя.
      Разговор не помог. Что делать дальше?
  base_chance: 0.12
  participants_template: random_one
  success_effects:
    - type: survival_change
      value: 10
  failure_effects:
    - type: survival_change
      value: -15
    - type: kill_random_active
  chain_success: survivor_calmed
  chain_failure: tragedy_from_madness

- id: survivor_calmed
  event_type: narrative
  title: Кризис миновал
  description: >-
    Удалось успокоить обезумевшего. Он тих, подавлен, но снова среди своих.
    Все выдыхают.
  success_effects: []

- id: tragedy_from_madness
  event_type: narrative
  title: Трагедия
  description: >-
    Предотвратить худшее не вышло. Один из выживших мёртв от руки товарища.
    Бункер погрузился в тяжёлое молчание.
  success_effects:
    - type: survival_change
      value: -5
