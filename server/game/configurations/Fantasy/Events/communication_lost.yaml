id: communication_lost
title:
  - Потеря связи с внешним миром
  - Молчат переговорные камни
  - Радиомолчание
description:
  - >-
    {alt.device} перестали работать из-за {alt.cause},
    и мы отрезаны от внешнего мира. Как нам восстановить связь или получить
    информацию о том, что происходит снаружи?
  - >-
    После {alt.cause_case} больше не отвечает ни один {alt.channel}.
    Что мы предпримем, чтобы снова услышать хоть кого-то снаружи?
alt:
  - device:
      - Магические переговорные камни
      - Связные руны
      - Сигнальный узел бункера
    cause:
      - погасшего рунного контура
      - сильных помех
      - сбоя в питающем кристалле
    cause_case:
      - сбоя в рунном контуре
      - сильных помех
      - отказа питающего кристалла
    channel:
      - переговорный камень
      - сигнальный канал
      - внешний приёмник
base_chance: 0.25
success_effects:
  - type: survival_change
    value: 10
failure_effects:
  - type: survival_change
    value: -15
