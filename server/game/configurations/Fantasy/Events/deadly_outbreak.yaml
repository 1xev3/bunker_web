id: deadly_outbreak
title:
  - Смертельная зараза
  - Стремительная болезнь
  - Вирус без лечения
description:
  - >-
    Вспышка неизвестной болезни накрыла бункер. У {participants} уже критическое состояние.
    Есть ли у нас хоть что-то, чтобы спасти хотя бы часть заражённых?
  - >-
    {participants} потеряли сознание, а симптомы распространяются.
    Если мы не действуем немедленно — потеряем людей.
base_chance: 0.06
participants_template: random_group
participants_min: 1
participants_max: 3
success_effects:
  - type: survival_change
    value: 10
failure_effects:
  - type: survival_change
    value: -20
  - type: kill_participant
    target: each_participant
    chance: 0.4
    per_target_chance: 0.2
