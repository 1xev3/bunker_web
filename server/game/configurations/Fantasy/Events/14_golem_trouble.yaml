# Голем-носильщик сбоит: нарастающий кризис с развилкой ремонт/разобрать/запереть.
events:
  - id: golem_confusion
    type: flavor
    weight: 1
    when:
      min_players: 2
      flag_unset: [golem_incident]
    title: Голем не слушается
    text: >-
      Голем-носильщик, молча таскавший грузы с первого дня, начал вести себя
      странно: несёт ящик не туда, разворачивается посреди коридора и застывает,
      уставившись в стену. Рунная вязь на его груди мигает. Что-то пошло не так.
    effects:
      - { on: all, sanity: -3 }
    schedule:
      - { event: golem_rampage, in: 1, chance: 70 }

  - id: golem_rampage
    type: choice
    scheduled_only: true
    select:
      kinds: [item, profession]
      prompt_item: Выберите материал для перепрошивки рун
      prompt_profession: Кто возьмётся за починку
    title: Голем вышел из строя
    text: >-
      Ночью голем снёс стеллаж и придавил половину запасов. Руны мерцают
      тревожным красным — ещё час, и он начнёт крушить всё подряд.
    options:
      - id: golem_repair
        label: Перепрошить руны
        description: Нужны материалы и умелые руки — иначе рискуете сделать хуже.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: Руны переписаны — голем замер, затем поклонился. Снова работает.
              effects:
                - { on: all, sanity: 8 }
                - { flag: { golem_incident: true } }
          some:
            - chance: 55
              text: Кое-как получилось. Голем чуть медленнее, но слушается.
              effects:
                - { on: all, sanity: 3 }
                - { flag: { golem_incident: true } }
            - text: Неполная прошивка привела к новому сбою — голем встал насовсем.
              effects:
                - { on: all, sanity: -6 }
                - { food: "8%" }
                - { flag: { golem_incident: true } }
          none:
            - text: Без материалов и знаний попытка лишь разозлила голема. Крушил до утра.
              effects:
                - { on: all, health: -5, sanity: -10 }
                - { food: "12%" }
                - { flag: { golem_incident: true } }
      - id: golem_destroy
        label: Разобрать на части
        description: Избавиться от угрозы — но потерять рабочую силу.
        effects:
          - { on: all, sanity: -4 }
          - { food: 50 }
          - { flag: { golem_incident: true } }
      - id: golem_lock
        label: Запереть в отсеке
        description: Закрыть его до лучших времён — пусть постоит.
        effects:
          - { on: all, sanity: -5 }
          - { flag: { golem_incident: true } }
        schedule:
          - { event: golem_escapes, in: 2, chance: 50 }

  - id: golem_escapes
    type: flavor
    scheduled_only: true
    title: Голем вырвался
    text: >-
      Дверь отсека слетела с петель — голем выломался. Пока его утихомирили,
      он успел перевернуть половину ящиков и проломить внутреннюю стену.
    effects:
      - { on: all, sanity: -6 }
      - { food: "10%" }
