# Вода отравлена — найти причину и очистить или потерять людей.
events:
  - id: tainted_water
    type: choice
    weight: 1
    when:
      flag_unset: [water_tainted_resolved]
    participants:
      patient: {}
    vars:
      symptom: "{жёлтый оттенок и рвота кровью|металлический привкус, судороги, потеря сознания|зеленоватое свечение и онемение конечностей|горечь, а потом {patient} просто упал}"
    title: Вода убивает
    text: >-
      {patient} выпил из общего бака и упал — {event.symptom}. Остальные
      тоже пили сегодня. Можно поднять всё, что позволит найти причину
      и очистить запасы, — или немедленно переходить на резерв и молиться,
      что уже выпитого хватит не на всех.
    select:
      kinds: [item, profession]
      prompt_item: Достать анализаторы, реагенты и очищающее снаряжение
      prompt_profession: Кто разберётся с водой
    options:
      - id: water_purify
        label: Найти причину и очистить
        description: >-
          Алхимический нюхач, очищающий порошок, антидоты, фильтры — с
          алхимиком или целителем шанс найти и убрать яд намного выше.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: >-
                Нашли — магическая плесень в трубе питания. Вычистили,
                {patient} получил антидот и пошёл на поправку. Вода снова чистая.
              effects:
                - { on: patient, health: 15, sanity: 10 }
                - { on: all, health: 5, sanity: 8 }
                - { flag: { water_tainted_resolved: true } }
          some:
            - chance: 55
              text: >-
                Воду кое-как очистили. {patient} ещё лежит, но не умирает —
                остальные отделались тошнотой.
              effects:
                - { on: patient, health: -20, sanity: -10 }
                - { on: all, health: -10, sanity: -8 }
                - { flag: { water_tainted_resolved: true } }
            - text: >-
                Без нужных реагентов или знаний — ничего не вышло. {patient}
                угасает, остальные тоже травятся.
              effects:
                - { on: patient, kill: true }
                - { on: all, health: -20, sanity: -15 }
                - { flag: { water_tainted_resolved: true } }
          none:
            - text: >-
                Не определили, не очистили — {patient} умер первым. Остальные
                травятся из того же бака.
              effects:
                - { on: patient, kill: true }
                - { on: all, health: -30, sanity: -20 }
                - { flag: { water_tainted_resolved: true } }
      - id: water_reserve
        label: Немедленно перейти на резерв
        description: >-
          Не трогать основной бак — пить только из неприкосновенного резерва.
          Дорого, но безопасно.
        effects:
          - { on: patient, health: -20, sanity: -12 }
          - { on: all, health: -8 }
          - { food: -100 }
          - { flag: { water_tainted_resolved: true } }
      - id: water_boil
        label: Кипятить всё подряд
        description: >-
          Кипячение не спасает от магической заразы — но попробовать стоит.
        outcomes:
          - chance: 40
            text: Оказалось, обычная бактерия — кипячение помогло.
            effects:
              - { on: patient, health: -10, sanity: -8 }
              - { flag: { water_tainted_resolved: true } }
          - text: >-
              Магическую заразу кипячением не берёшь. {patient} умер,
              остальные постепенно травятся дальше.
            effects:
              - { on: patient, kill: true }
              - { on: all, health: -25, sanity: -18 }
              - { flag: { water_tainted_resolved: true } }
