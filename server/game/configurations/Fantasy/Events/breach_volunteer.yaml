id: breach_volunteer
type: choice
weight: 1
when:
  min_players: 2
  flag_unset: [breach_sealed]
select:
  kind: player
  prompt: Кого отправить заделать пробоину?
title: Пробоина в обшивке
text: >-
  Сквозь трещину в стене сочится спёртый воздух. В узкий лаз пролезет только один
  человек — но если он застрянет, вытаскивать будет поздно.
options:
  - id: send
    label: Отправить добровольца
    description: Выберите человека. Риск есть, но иначе дышать будет нечем.
    outcomes:
      - chance: 60
        text: Пробоину заделали, воздух снова чистый.
        effects:
          - { on: chosen, health: -4, sanity: 8 }
          - { flag: { breach_sealed: true } }
      - text: Доброволец застрял и едва выбрался; всем стало хуже от пыли.
        effects:
          - { on: chosen, health: -22, sanity: -10 }
          - { on: chosen, status: { id: cramped_chest, label: Сдавленная грудь, stat: health, value: -5, months: 2 } }
          - { on: others, status: { id: stale_air, label: Спёртый воздух, stat: health, value: -3, months: 2 } }
  - id: seal_off
    label: Запечатать отсек
    description: Никого не рисковать, но бункер станет теснее и холоднее.
    effects:
      - { on: all, sanity: -6 }
      - { on: all, status: { id: cold, label: Холод, stat: health, value: -4, months: 2 } }
