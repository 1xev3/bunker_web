# fantasy_cursed_grove_chain.yaml

- id: fantasy_cursed_grove
  event_type: interactive
  title:
    - Проклятая роща
    - Шёпот древних корней
    - Лес, которого не было вчера
  description:
    - >-
      У входа в убежище за одну ночь выросла чёрная роща.
      Первым знаком стали {alt.omen}. Стволы деревьев покрыты рунами,
      а между ветвями мерцают золотые огни. {seer} утверждает,
      что это не обычный лес, а древний узел магии. Какие профессии
      или предметы помогут безопасно исследовать рощу?
    - >-
      За стенами убежища появился лес, которого вчера не существовало.
      Изнутри доносятся {alt.sound}, а по краю тумана бродят {alt.creature}.
      {guardian} считает, что роща может скрывать источник силы,
      но каждый шаг туда будет сделан под взглядом чего-то древнего.
      Какие профессии или предметы помогут пройти через туман и не попасть
      в ловушку?
  alt:
    - omen:
        - вороны с серебряными глазами
        - светляки, складывающиеся в руны
        - корни, шевелящиеся как пальцы
        - туман, пахнущий мёдом и кровью
      sound:
        - песни на забытом языке
        - детский смех без источника
        - удары барабанов под землёй
        - шёпот, повторяющий имена выживших
      creature:
        - олени с человеческими лицами
        - тени в коронах из ветвей
        - белые волки без следов
        - мотыльки размером с ладонь
  participants:
    - role: seer
      optional: true
      filter:
        any:
          - profession_group: medic
          - hobby_group: creative
          - trait: Храбрый
    - role: guardian
      optional: true
      filter:
        any:
          - profession_group: fighter
          - body: Атлетическое
          - trait: Храбрый
  base_chance: 0.10
  success_effects:
    - type: survival_change
      value: 10
    - type: food_change
      value: 140
    - type: if
      condition:
        participant: seer
        filter:
          any:
            - hobby_group: creative
            - profession_group: medic
      then:
        - type: survival_change
          value: 8
      else:
        - type: survival_change
          value: 3
  failure_effects:
    - type: survival_change
      value: -8
    - type: kill_random_active
      chance: 0.2
    - type: food_change
      value: -10
  chain_success: fantasy_cursed_grove_heart
  chain_failure: fantasy_cursed_grove_lost_path


- id: fantasy_cursed_grove_heart
  event_type: interactive
  title:
    - Сердце рощи
    - Алтарь под корнями
    - Дар лесной ведьмы
  description:
    - >-
      В центре рощи группа нашла алтарь, обвитый живыми корнями.
      На нём лежит {alt.relic}. Из тумана выходит {alt.witch}
      и предлагает сделку: взять артефакт и впустить в убежище
      {alt.envoy}, или сжечь алтарь и забрать только то,
      что роща уже отдала. Какое решение примет группа?
    - >-
      Корни расступились, открывая древний алтарь. Над ним парит
      {alt.relic}. Голос из деревьев обещает защиту, урожай и тайные знания,
      но требует, чтобы группа приняла в убежище {alt.envoy}.
      Принять сделку или уничтожить алтарь?
  alt:
    - relic:
        - лунный осколок
        - костяная диадема
        - семя мирового древа
        - чаша забытой богини
      witch:
        - лесная ведьма
        - старая фейри в короне из мха
        - женщина с оленьими рогами
        - слепая хранительница корней
      envoy:
        - Мшистого Отрока
        - Девочку с глазами оленя
        - Безымянного Фейри
        - Сына Корней
  choice_labels:
    success: Принять сделку
    failure: Сжечь алтарь
  success_effects:
    - type: add_player
      character_type: full
      name_template: Посланник рощи
    - type: survival_change
      value: 12
    - type: food_change
      value: 100
    - type: schedule_event
      event_id: fantasy_cursed_grove_envoy_dream
      delay_months: 2
  failure_effects:
    - type: survival_change
      value: 5
    - type: food_change
      value: 220
    - type: schedule_event
      event_id: fantasy_cursed_grove_witch_revenge
      delay_months: 1
  chain_success: fantasy_cursed_grove_pact
  chain_failure: fantasy_cursed_grove_burned_altar


- id: fantasy_cursed_grove_lost_path
  event_type: interactive
  title:
    - Тропа без выхода
    - Лес замкнулся
    - Круги под луной
  description:
    - >-
      Роща не отпустила группу. Одни и те же деревья появляются снова и снова,
      а на коре проступают {alt.sign}. Можно оставить часть припасов
      в качестве дара лесу или попытаться прорубить путь силой.
      Что выберет группа?
    - >-
      Тропа исчезла. Компас крутится, факелы горят {alt.flame},
      а в тумане слышны {alt.voices}. Лес требует плату за выход.
      Откупиться дарами или пробиваться через чащу?
  alt:
    - sign:
        - имена выживших
        - даты будущих смертей
        - символы старых богов
        - свежие следы ладоней
      flame:
        - зелёным пламенем
        - синим холодным огнём
        - чёрным дымом без жара
        - серебряными искрами
      voices:
        - голоса близких
        - обещания богатства
        - плач потерянных детей
        - шёпот мёртвых королей
  choice_labels:
    success: Оставить дар лесу
    failure: Прорубаться силой
  success_effects:
    - type: food_change
      value: -15
    - type: survival_change
      value: 4
    - type: schedule_event
      event_id: fantasy_cursed_grove_marked_by_fae
      delay_months: 2
  failure_effects:
    - type: survival_change
      value: -10
    - type: kill_random_active
      chance: 0.35
    - type: kill_random_active
      chance: 0.15
  chain_success: fantasy_cursed_grove_returned_changed
  chain_failure: fantasy_cursed_grove_blood_on_roots


- id: fantasy_cursed_grove_pact
  event_type: narrative
  title:
    - Договор с рощей
    - Гость из зелёного тумана
  description:
    - >-
      Посланник рощи вошёл в убежище без страха. Там, где он прошёл,
      из трещин в полу выросли {alt.growth}. Запасы больше не портятся
      так быстро, а по ночам кто-то поёт {alt.song}.
    - >-
      Сделка заключена. Новый обитатель почти не говорит, но каждое утро
      оставляет у кладовой {alt.gift}. Никто не знает, благодарность это
      или первый росток будущего проклятия.
  alt:
    - growth:
        - тонкие зелёные побеги
        - белые грибы с золотыми прожилками
        - корни, тянущиеся к спальням
        - цветы, пахнущие дождём
      song:
        - колыбельные на древнем языке
        - тихие молитвы лесным богам
        - мелодии без слов
        - песни о тех, кто ещё не умер
      gift:
        - спелые плоды
        - горсть сладких орехов
        - листья с целебным соком
        - чашу прозрачной росы
  success_effects:
    - type: survival_change
      value: 5


- id: fantasy_cursed_grove_burned_altar
  event_type: narrative
  title:
    - Пепел на корнях
    - Сожжённый дар
  description:
    - >-
      Алтарь вспыхнул {alt.fire}. Ведьма не закричала — только улыбнулась
      и растворилась в дыму. Роща отступила, оставив после себя припасы,
      но на двери убежища появилась {alt.mark}.
    - >-
      Когда алтарь рухнул, лес на мгновение стал совершенно тихим.
      Потом из-под земли донёсся {alt.sound}. Группа вернулась с добычей,
      но каждый понимал: это не конец.
  alt:
    - fire:
        - белым пламенем
        - зелёным огнём без дыма
        - холодным серебряным светом
        - чёрным пламенем, не дающим тепла
      mark:
        - свежая руна мести
        - кровавая ладонь
        - трещина в форме глаза
        - надпись на неизвестном языке
      sound:
        - женский смех
        - стук тысяч корней
        - вой невидимых зверей
        - "шёпот: «долг принят»"
  success_effects:
    - type: survival_change
      value: -2


- id: fantasy_cursed_grove_returned_changed
  event_type: narrative
  title:
    - Возвращение из зелёного тумана
    - Метки на коже
  description:
    - >-
      Группа вернулась, но никто не помнит, сколько времени прошло внутри рощи.
      На коже участников проступили {alt.mark}. Они не болят, но иногда
      светятся рядом с магией.
    - >-
      Выжившие вышли из леса молча. В их волосах застряли {alt.trace},
      а в глазах на мгновение отражались {alt.reflection}.
  alt:
    - mark:
        - узоры листьев
        - тонкие серебряные линии
        - символы фейри
        - пятна, похожие на древесную кору
      trace:
        - лепестки ночных цветов
        - пепел древнего костра
        - золотая пыльца
        - иглы чёрных сосен
      reflection:
        - чужие звёзды
        - ветви огромного дерева
        - лица незнакомых духов
        - огни далёкого праздника
  success_effects:
    - type: survival_change
      value: 3


- id: fantasy_cursed_grove_blood_on_roots
  event_type: narrative
  title:
    - Кровь на корнях
    - Цена прорыва
  description:
    - >-
      Лес выпустил выживших только после того, как получил свою цену.
      У входа в убежище остались {alt.trace}, а в земле под дверью
      теперь каждую ночь что-то шевелится.
    - >-
      Те, кто прорубался силой, вернулись с {alt.wound}. За ними по земле
      тянулись корни, пока первые лучи солнца не обратили их в пепел.
  alt:
    - trace:
        - следы когтей
        - капли чёрного сока
        - обломки костяных ветвей
        - отпечатки копыт
      wound:
        - глубокими порезами от шипов
        - ожогами от зелёного пламени
        - ледяными пятнами на коже
        - проклятыми занозами под ногтями
  success_effects:
    - type: survival_change
      value: -6


- id: fantasy_cursed_grove_envoy_dream
  event_type: narrative
  title:
    - Сон посланника
    - Голос под корнями
  description:
    - >-
      Посланник рощи заговорил во сне. Его голосом говорило {alt.entity}:
      «Когда корни дойдут до сердца камня, ваш дом станет частью леса».
      Утром в кладовой нашли {alt.food}.
    - >-
      Ночью новый обитатель сел посреди убежища и начал рисовать на полу
      {alt.symbol}. К рассвету рисунок исчез, а рядом появились {alt.food}.
  alt:
    - entity:
        - нечто огромное и древнее
        - мать всех корней
        - забытый лесной бог
        - королева фейри
      food:
        - новые плоды со сладкой золотой мякотью
        - грибы, пахнущие свежим хлебом
        - орехи в серебряной скорлупе
        - ягоды, светящиеся в темноте
      symbol:
        - карту подземных корней
        - круг из листьев и костей
        - знак раскрытого глаза
        - спираль из зелёного света
  success_effects:
    - type: food_change
      value: 180
    - type: survival_change
      value: 4


- id: fantasy_cursed_grove_witch_revenge
  event_type: narrative
  title:
    - Ведьмин долг
    - Руна мести
  description:
    - >-
      На рассвете все зеркала в убежище почернели. В каждом отражении стоит
      {alt.figure} и беззвучно считает оставшиеся дни. Один из замков
      на внешней двери проржавел за ночь.
    - >-
      Руна на двери раскрылась, как глаз. Из неё потёк {alt.substance},
      а по коридорам прошёл {alt.wind}. Сожжённый алтарь всё-таки
      потребовал расплаты.
  alt:
    - figure:
        - лесная ведьма
        - старая фейри в короне из мха
        - женщина с оленьими рогами
        - слепая хранительница корней
      substance:
        - чёрный сок
        - холодный туман
        - пепел с запахом роз
        - густой зелёный свет
      wind:
        - ветер с запахом сырой земли
        - шёпот тысячи листьев
        - смех невидимых детей
        - запах костра под дождём
  success_effects:
    - type: survival_change
      value: -10
    - type: remove_room


- id: fantasy_cursed_grove_marked_by_fae
  event_type: narrative
  title:
    - Метка фейри
    - Должники зелёного двора
  description:
    - >-
      Те, кто оставил дар лесу, теперь иногда слышат {alt.music} за стенами.
      Она помогает не сойти с ума, но зовёт наружу. Фейри не забыли плату
      и считают группу своими должниками.
    - >-
      На пороге убежища появились {alt.token}. Никто не видел, кто их оставил.
      Рядом была выцарапана фраза: «Первый дар принят. Второй будет назван позже».
  alt:
    - music:
        - музыку серебряных флейт
        - тихий хороводный напев
        - звон невидимых колокольчиков
        - песню, похожую на шум дождя
      token:
        - венки из белых цветов
        - маленькие костяные монеты
        - пучки трав, перевязанные волосами
        - камни с вырезанными улыбками
  success_effects:
    - type: survival_change
      value: 6
