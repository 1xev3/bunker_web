id: morale_crisis
title:
  - Кризис боевого духа
  - Апатия в отсеках
  - Упадок настроения
description:
  - >-
    Долгое заключение в бункере сломило дух обитателей: {alt.mood_state}
    всё сильнее лишают людей воли к выживанию.
    Как мы можем поднять моральный дух группы?
  - >-
    После {alt.trigger} в отсеках повисла тяжёлая тишина, и люди всё чаще
    говорят о {alt.thoughts}. Что мы сделаем, чтобы вернуть группе желание бороться?
alt:
  - mood_state:
      - депрессия и апатия
      - усталость и отчаяние
      - тревога и эмоциональное выгорание
    trigger:
      - тяжёлой недели без хороших новостей
      - череды неудач
      - долгих дней однообразия
    thoughts:
      - бессмысленности происходящего
      - том, что сил больше не осталось
      - желании просто всё бросить
base_chance: 0.20
success_effects:
  - type: survival_change
    value: 15
failure_effects:
  - type: survival_change
    value: -20
