# Лихорадка скверны: лечить со всем тщанием или переждать. Запущенная хворь
# расползается по тесному убежищу.
events:
  - id: fever
    type: choice
    weight: 2
    when:
      min_players: 1
    participants:
      patient: {}
    vars:
      symptom: "{горит в магическом жару|бьётся в ознобе|бредит и не узнаёт своих}"
    title: Лихорадка скверны
    text: >-
      {patient} {event.symptom}. Можно перебрать запасы зелий и снадобий и найти
      того, кто выходит больного, — или понадеяться, что хворь отступит сама.
    select:
      kinds: [item, profession]
      prompt_item: Перебрать запасы снадобий
      prompt_profession: Кто выходит больного?
    options:
      - id: medicate
        label: Лечить
        description: >-
          С зельем и целителем — почти наверняка на ноги. С чем-то одним — как
          выйдет. С пустыми руками — наугад.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: "{Жар сбили|Скверну унял отвар} к утру — {patient} идёт на поправку."
              effects:
                - { on: patient, health: 20, sanity: 8, clear_status: debuffs }
                - { on: others, sanity: 4 }
          some:
            - chance: 60
              text: Помогло не сразу, но {patient} всё же выкарабкался.
              effects:
                - { on: patient, health: 10, sanity: -4 }
                - { on: patient, status: { id: infection, label: Воспаление, stat: health, value: -6, months: 2 } }
            - text: Полумеры не справились с хворью.
              effects:
                - { on: patient, health: -20, sanity: -10 }
                - { on: patient, status: { id: infection, label: Воспаление, stat: health, value: -8, months: 3 } }
          none:
            - text: Без зелий и знаний со скверной не совладать — стало только хуже.
              effects:
                - { on: patient, health: -28, sanity: -15 }
                - { on: patient, status: { id: infection, label: Воспаление, stat: health, value: -8, months: 3 } }
                - { on: others, sanity: -5 }
      - id: wait
        label: Переждать
        description: Ничего не тратить — но это риск.
        outcomes:
          - chance: 35
            text: "{Жар отступил сам собой|Хворь миновала к утру|Тело справилось}."
            effects:
              - { on: patient, health: -5, sanity: -4 }
          - text: Стало хуже — началось воспаление, перекинулось на других.
            effects:
              - { on: patient, health: -25, sanity: -12 }
              - { on: patient, status: { id: infection, label: Воспаление, stat: health, value: -8, months: 3 } }
            schedule:
              - { event: fever_spreads, in: 1, chance: 65, carry: [patient] }

  - id: fever_spreads
    type: flavor
    scheduled_only: true
    title: Хворь пошла по убежищу
    text: >-
      Скверна {patient} не осталась в одиночку: в тесноте {кашель|жар|озноб}
      перекинулся на других. Лазарет переполнен.
    effects:
      - { on: random, health: -18, sanity: -8 }
      - { on: random, status: { id: infection, label: Воспаление, stat: health, value: -8, months: 2 } }
      - { on: all, health: -8, sanity: -6 }
