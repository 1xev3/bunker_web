# Разведчик вернулся умирающим — лечить немедленно или потерять его.
events:
  - id: wounded_scout
    type: choice
    weight: 2
    when:
      min_players: 2
    participants:
      scout: {}
    vars:
      wound: "{глубокий разрыв с рунным ожогом|отравленная стрела, обломившаяся в плече|магический ожог, разъедающий грудь|укус твари с чернеющей краями раной}"
    title: Разведчик умирает
    text: >-
      {scout} дополз до ворот и рухнул — {event.wound}. Кровь не останавливается,
      дыхание рваное. Без помощи до утра точно не доживёт. Можно поднять все
      лечебные запасы и найти того, кто умеет — или смириться.
    select:
      kinds: [item, profession]
      prompt_item: Поднять зелья, кристаллы, перевязочное из запасов
      prompt_profession: Кто возьмётся вытащить {scout}
    options:
      - id: scout_treat
        label: Лечить немедленно
        description: >-
          Лечебные кристаллы, руны стабилизации, зелья — каждый предмет
          и каждый опытный целитель повышают шанс.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: >-
                К рассвету {scout} уже ругался на свою неосторожность.
                Рана затянулась чисто — как будто и не было.
              effects:
                - { on: scout, health: 25, sanity: 12 }
                - { on: others, sanity: 8 }
          some:
            - chance: 60
              text: >-
                Кое-как стабилизировали. {scout} выживет, но несколько недель
                будет лежать — рана живая.
              effects:
                - { on: scout, health: -10, sanity: -8 }
                - { on: scout, status: { id: slow_recovery, label: Гниющая рана, stat: health, value: -8, months: 3 } }
            - text: >-
                Ни снаряжения, ни умений не хватило — {scout} угасал на глазах
                всю ночь, и спасти его не удалось.
              effects:
                - { on: scout, kill: true }
                - { on: others, sanity: -20 }
          none:
            - text: >-
                Без помощи рана воспалилась к рассвету. {scout} умер так и не
                придя в сознание.
              effects:
                - { on: scout, kill: true }
                - { on: others, health: -5, sanity: -25 }
      - id: scout_wait
        label: Переждать — может, сам выживет
        description: Ничего не тратить. Организм или справится, или нет.
        outcomes:
          - chance: 25
            text: >-
              К утру рана затихла — тело справилось. Выжил чудом и сам это
              понимает.
            effects:
              - { on: scout, health: -15, sanity: -10 }
          - text: >-
              Не справился. {scout} умер до рассвета — один, без помощи.
            effects:
              - { on: scout, kill: true }
              - { on: others, health: -5, sanity: -25 }
