id: poisoning
title:
  - Отравление воды
  - Токсичная примесь
  - Вода стала опасной
description:
  - >-
    Анализ показал, что в питьевой воде есть следы {alt.toxin},
    и {participants} уже чувствуют {alt.symptom}.
    Как мы можем срочно очистить воду и помочь пострадавшим?
  - >-
    После употребления воды {participants} жалуются на {alt.symptom},
    а в резервуаре нашли {alt.toxin_case}.
    Что мы сделаем в первую очередь, чтобы остановить отравление?
alt:
  - toxin:
      - яда
      - токсичных примесей
      - опасного алхимического осадка
    toxin_case:
      - следы яда
      - токсичные примеси
      - алхимический осадок
    symptom:
      - слабость и тошноту
      - резь в животе и головокружение
      - жар и сильную сухость во рту
base_chance: 0.05
participants_template: random_group
participants_min: 2
participants_max: 4
success_effects:
  - type: survival_change
    value: 15
failure_effects:
  - type: survival_change
    value: -20
  - type: kill_participant
    target: each_participant
    per_target_chance: 0.5
