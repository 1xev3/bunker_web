# Нечисть обосновалась в убежище — изгнать артефактами или жить в кошмаре.
events:
  - id: haunting
    type: choice
    weight: 1
    when:
      min_players: 2
      flag_unset: [haunting_resolved]
    participants:
      victim: {}
    vars:
      entity: "{тень|призрак|неупокоенный дух|бесплотная тварь}"
    title: "{event.entity} в убежище"
    text: >-
      {victim} первым столкнулся с ней — {event.entity} скользит по коридорам,
      переставляет вещи, шепчет. Прошлой ночью {victim} нашли без сознания в
      дальнем отсеке. Убежище не спит. Можно собрать всё, что годится для
      изгнания, — или надеяться, что само уйдёт.
    select:
      kinds: [item, profession]
      prompt_item: Собрать защитные артефакты для ритуала изгнания
      prompt_profession: Кто проведёт ритуал
    options:
      - id: haunting_exorcise
        label: Изгнать
        description: >-
          Охранные руны, колокол изгнания, круги защиты, свитки печати —
          чем богаче набор и опытнее изгонятель, тем чище уйдёт.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: >-
                Дух выбросило вон с воем — стены три дня ещё слабо светились.
                Убежище наконец выспалось.
              effects:
                - { on: all, health: 8, sanity: 18 }
                - { on: victim, health: 12 }
                - { flag: { haunting_resolved: true } }
          some:
            - chance: 50
              text: >-
                Изгнали, но не до конца — дух ушёл, однако иногда мерещится
                в углах. Люди досыпают с трудом.
              effects:
                - { on: all, health: -10, sanity: -12 }
                - { on: all, status: { id: haunted_sleep, label: Тревожный сон, stat: sanity, value: -4, months: 3 } }
                - { flag: { haunting_resolved: true } }
            - text: >-
                Ритуал разозлил духа — следующая ночь выдалась жуткой. {victim}
                нашли под утро в беспамятстве.
              effects:
                - { on: victim, health: -40, sanity: -30 }
                - { on: all, health: -12, sanity: -20 }
                - { flag: { haunting_resolved: true } }
          none:
            - text: >-
                Без нужных артефактов и знаний нечисть лишь развеселилась.
                Несколько человек до сих пор не могут вспомнить ту ночь.
              effects:
                - { on: victim, kill: true }
                - { on: all, health: -15, sanity: -25 }
                - { flag: { haunting_resolved: true } }
      - id: haunting_negotiate
        label: Попробовать договориться
        description: Нечисть редко приходит без причины — может, у неё есть дело.
        outcomes:
          - chance: 40
            text: >-
              Оказалось, дух искал конкретную вещь. Отдали — ушёл тихо,
              оставив запас там, где раньше стояла пустота.
            effects:
              - { on: all, health: 5, sanity: 12 }
              - { food: 80 }
              - { flag: { haunting_resolved: true } }
          - text: >-
              Дух не хотел говорить. Хотел мучить. У него получилось — двое
              потом долго боялись темноты.
            effects:
              - { on: victim, health: -50, sanity: -30 }
              - { on: all, sanity: -20 }
              - { flag: { haunting_resolved: true } }
      - id: haunting_ignore
        label: Не обращать внимания
        description: Не провоцировать — может, уйдёт само.
        outcomes:
          - chance: 20
            text: >-
              Дух поскучал без зрителей и убрался сам — несколько тихих ночей,
              и убежище наконец выспалось.
            effects:
              - { on: all, sanity: 10 }
              - { on: victim, health: 5, sanity: 8 }
              - { flag: { haunting_resolved: true } }
          - text: >-
              Молчание лишь раззадорило нечисть. {victim} извёлся вконец,
              а по ночам убежище глаз не смыкало.
            effects:
              - { on: victim, health: -20, sanity: -25 }
              - { on: all, health: -8, sanity: -18 }
              - { on: all, status: { id: haunted_long, label: Ужас по ночам, stat: sanity, value: -5, months: 4 } }
              - { flag: { haunting_resolved: true } }
