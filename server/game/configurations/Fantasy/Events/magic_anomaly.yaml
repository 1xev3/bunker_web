id: magic_anomaly
title:
  - Магическая аномалия
  - Пространственное искажение
  - Рунный всплеск
description:
  - >-
    Возникла нестабильная магическая аномалия, искажающая пространство
    и вызывающая галлюцинации. Как мы можем нейтрализовать её, пока она
    не навредила всему бункеру?
  - >-
    Начался рунный всплеск: воздух дрожит, стены плывут, а люди видят {alt.vision}.
    Чем мы сможем стабилизировать этот участок?
alt:
  - vision:
      - чужие тени
      - несуществующие двери
      - мерцающие силуэты
base_chance: 0.05
participants_template: random_group
participants_min: 2
participants_max: 4
success_effects:
  - type: survival_change
    value: 15
failure_effects:
  - type: survival_change
    value: -15
  - type: kill_random_active
    chance: 0.5
