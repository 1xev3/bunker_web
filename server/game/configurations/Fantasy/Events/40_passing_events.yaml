# Малые события «по факту»: тип flavor, без выбора — просто сообщают,
# что в убежище что-то произошло, и применяют эффекты. Микс хорошего,
# плохого и нейтрального, чтобы разбавлять крупные choice-события.
events:
  # --- Хорошее ---
  - id: warm_spring
    type: flavor
    weight: 1
    when:
      min_players: 1
    vars:
      source: "{в стене ожила старая руна тепла|сквозь трещину пробился тёплый родник|ожил забытый очаг в нижнем ярусе}"
    title: Нежданное тепло
    text: >-
      Ночью {event.source}. Впервые за долгое время в убежище можно
      согреться по-настоящему — люди отоспались и приободрились.
    effects:
      - { on: all, sanity: 6, health: 3 }

  - id: good_dream
    type: flavor
    weight: 1
    participants:
      dreamer: {}
    vars:
      vision: "{родной дом|зелёные поля до самого горизонта|лицо того, кого давно не видел}"
    title: Светлый сон
    text: >-
      {dreamer} {видел|увидел} во сне {event.vision} — и проснулся с
      непривычной лёгкостью на душе. За завтраком {dreamer} пересказал сон,
      и стало теплее всем.
    effects:
      - { on: dreamer, sanity: 8 }
      - { on: others, sanity: 3 }

  - id: hidden_stash
    type: flavor
    weight: 1
    vars:
      who: "{кто-то из старожилов|самый молодой из жильцов|случайный взгляд}"
    title: Забытый тайник
    text: >-
      Разбирая хлам в дальнем углу, {event.who} наткнулся на запечатанный
      ящик со старыми припасами. Немного, но в такие времена и это праздник.
    effects:
      - { food: 400 }
      - { on: all, sanity: 4 }

  - id: clear_water
    type: flavor
    weight: 1
    when:
      min_month: 2
    title: Чистая жила
    text: >-
      Вода из нижнего источника вдруг пошла {прозрачная|сладкая|ледяная и
      чистая} — без привычного привкуса гнили. Мелочь, а на душе светлее.
    effects:
      - { on: all, health: 4, sanity: 4 }

  # --- Плохое ---
  - id: damp_creeps
    type: flavor
    weight: 1
    when:
      min_month: 2
    title: Сырость наступает
    text: >-
      По стенам поползла {чёрная плесень|липкая сырость|холодная испарина}.
      Вещи отсыревают, дышать тяжелее, и кое-кто уже кашляет по ночам.
    effects:
      - { on: all, health: -9, sanity: -6 }
      - { on: random, health: -10 }

  - id: nightmare_wave
    type: flavor
    weight: 1
    when:
      min_players: 2
    title: Дурная ночь
    text: >-
      Всем разом снилась одна и та же {тьма за дверью|тяжёлая поступь в
      коридоре|чужая песня без слов}. Убежище проснулось разбитым и
      молчаливым — будто что-то заглянуло внутрь.
    effects:
      - { on: all, sanity: -12 }

  - id: spoiled_rations
    type: flavor
    weight: 1
    when:
      min_month: 1
    vars:
      cause: "{завелась гниль|пробрался грибок|просто прокисло}"
    title: Порча припасов
    text: >-
      Часть запасов пришлось выбросить — {event.cause}. Считать остатки
      стало неприятным занятием.
    effects:
      - { food: "15%" }
      - { on: all, sanity: -8 }

  - id: cold_snap
    type: flavor
    weight: 1
    when:
      min_month: 3
    title: Внезапный холод
    text: >-
      Снаружи резко похолодало, и стужа пробралась даже сюда. Все жмутся к
      теплу, кутаются во что попало и почти не выходят из общего зала.
    effects:
      - { on: all, health: -10, sanity: -8 }
      - { food: "8%" }

  - id: small_quarrel
    type: flavor
    weight: 1
    when:
      min_players: 3
    participants:
      one: {}
      two: {}
    title: Пустая ссора
    text: >-
      {one} и {two} сцепились из-за сущей ерунды — {очереди к котлу|чужого
      храпа|невпопад сказанного слова}. Дошло до крика; остальные молча
      разошлись по углам.
    effects:
      - { on: one, sanity: -9 }
      - { on: two, sanity: -9 }
      - { on: others, sanity: -4 }

  # --- Нейтральное / атмосферное ---
  - id: long_silence
    type: flavor
    weight: 1
    title: Долгая тишина
    text: >-
      День прошёл без единого происшествия. {Кто-то чинил утварь|Кто-то
      штопал одежду|Кто-то просто смотрел в потолок} — обычный серый день
      под землёй. Ни хорошо, ни плохо. Просто ещё один.
    effects:
      - { on: random, sanity: 2 }

  - id: strange_noise
    type: flavor
    weight: 1
    when:
      min_month: 2
    title: Странный звук
    text: >-
      Где-то в глубине ходов всю ночь {что-то скреблось|капала вода|гудел
      ветер}. К утру стихло, и никто так и не понял, что это было. Поговорили
      и забыли.
    effects:
      - { on: random, sanity: -6 }
      - { on: random, sanity: 3 }
