# Чужак у люка: впустить (с риском) или прогнать. Удачный приём -> новосёл прижился.
events:
  - id: stranger_at_hatch
    type: choice
    weight: 1
    when:
      min_month: 2
      min_players: 2
    title: Стук в люк
    text: >-
      Снаружи кто-то {колотит|скребётся|барабанит} в люк. Чужак умоляет впустить
      его. За дверью — холод и неизвестность, внутри — и так тесно.
    options:
      - id: let_in
        label: Впустить
        description: Лишние руки не помешают — но кто знает, что он принесёт.
        outcomes:
          - chance: 55
            text: Чужак оказался своим в доску и притащил с собой немного припасов.
            effects:
              - { food: 120 }
              - { on: all, sanity: 5 }
            schedule:
              - { event: stranger_settles, in: 2, chance: 60 }
          - text: Через пару дней стало ясно — он принёс с собой болезнь.
            effects:
              - { on: random, status: { id: outsider_fever, label: Лихорадка, stat: health, value: -8, months: 2 } }
              - { on: all, sanity: -4 }
      - id: turn_away
        label: Прогнать
        description: Своя шкура ближе. Но крик за дверью ещё долго будет в ушах.
        effects:
          - { on: all, sanity: -7 }
          - { on: random, status: { id: guilt, label: Чувство вины, stat: sanity, value: -4, months: 3 } }

  - id: stranger_settles
    type: flavor
    scheduled_only: true
    title: Новосёл прижился
    text: >-
      Чужак освоился и взялся помогать по хозяйству — даже расчистил ещё один
      угол под жильё. Стало чуть {легче|спокойнее|теплее}.
    effects:
      - { on: all, sanity: 4 }
      - { add_room: true }
