id: fever
type: choice
weight: 2
when:
  min_players: 1
participants:
  patient: {}
vars:
  symptom: "{горит в жару|бьётся в ознобе|бредит и не узнаёт своих}"
title: Ночная лихорадка
text: >-
  {patient} {event.symptom}. Можно посмотреть, что есть на складе, и потратить
  медикаменты — или понадеяться, что организм справится сам.
select:
  kind: item
  prompt_item: Посмотрите, что есть на складе
options:
  - id: medicate
    label: Посмотреть, что есть на складе
    description: Израсходовать выбранный предмет — почти наверняка сбить жар.
    requires: [item]
    consume_items: true
    effects:
      - { on: patient, health: 16, sanity: 4, clear_status: debuffs }
  - id: wait
    label: Переждать
    description: Ничего не тратить — но это риск.
    outcomes:
      - chance: 40
        text: "{Жар отступил сам собой|Кризис миновал к утру|Организм справился}."
        effects:
          - { on: patient, health: 4 }
      - text: Стало хуже — началось воспаление.
        effects:
          - { on: patient, health: -16 }
          - { on: patient, status: { id: infection, label: Воспаление, stat: health, value: -6, months: 2 } }
