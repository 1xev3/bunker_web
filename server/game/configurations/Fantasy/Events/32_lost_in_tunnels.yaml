# Кто-то заблудился в подземных ходах — найти или потерять насовсем.
events:
  - id: lost_in_tunnels
    type: choice
    weight: 1
    when:
      min_players: 3
    participants:
      lost: {}
    title: "{lost} пропал в ходах"
    text: >-
      {lost} ушёл проверить дальние туннели и не вернулся. Ходы петляют
      и уходят вглубь — там темно, сыро, и иногда что-то двигается.
      Чем дольше ждать, тем меньше шансов найти живым. Можно поднять
      всё, что поможет нащупать след, — или отправить кого-то следом.
    select:
      kinds: [item, player]
      prompt_item: Поднять навигационные и разведывательные артефакты
      prompt: Кого отправить на поиски
    options:
      - id: tunnels_search
        label: Искать
        description: >-
          Фамильяры-разведчики, глаза-фамильяры, кристаллы маршрута,
          светокристаллы — чем больше инструментов и надёжнее человек,
          тем больше шансов вернуть {lost} живым.
        requires: [item, player]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: >-
                Нашли быстро — {lost} сидел на развилке, сжав колени,
                и смотрел в темноту. Живой.
              effects:
                - { on: lost, health: -5, sanity: -12 }
                - { on: chosen, sanity: 12 }
                - { on: others, health: 3, sanity: 8 }
          some:
            - chance: 55
              text: >-
                Нашли, но не скоро — {lost} уже почти не реагировал.
                Что видел в темноте — не говорит.
              effects:
                - { on: lost, health: -22, sanity: -25 }
                - { on: chosen, health: -10, sanity: -8 }
                - { on: others, sanity: -8 }
            - text: >-
                Поиски ни к чему не привели. {chosen} вернулся один —
                бледный и без слов. {lost} объявился сам через двое суток.
              effects:
                - { on: lost, health: -35, sanity: -30 }
                - { on: chosen, health: -12, sanity: -15 }
                - { on: others, sanity: -12 }
          none:
            - text: >-
                Без снаряжения и помощи {lost} блуждал больше трёх суток.
                Когда нашли сам выход — он был уже не тот.
              effects:
                - { on: lost, health: -50, sanity: -40 }
                - { on: all, sanity: -15 }
      - id: tunnels_wait
        label: Ждать у входа
        description: Позвать и подождать — сам найдёт дорогу. Или нет.
        outcomes:
          - chance: 35
            text: "{lost} вышел сам через несколько часов — помятый, но живой."
            effects:
              - { on: lost, health: -15, sanity: -18 }
              - { on: all, sanity: -8 }
          - text: >-
              {lost} не вышел. Через неделю нашли его вещи у завала —
              без признаков борьбы, что как-то хуже.
            effects:
              - { on: lost, kill: true }
              - { on: all, health: -8, sanity: -22 }
