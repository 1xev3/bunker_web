# Водяное колесо заклинило — нужен доброволец нырнуть или альтернативное решение.
events:
  - id: water_wheel_clog
    type: choice
    weight: 1
    when:
      min_players: 2
      flag_unset: [wheel_incident]
    select:
      kind: player
      prompt: Кто нырнёт разобраться с колесом?
    title: Водяное колесо встало
    text: >-
      Водяное колесо остановилось — в канале что-то застряло. Без него насос
      не качает, вода кончится через несколько дней. Канал узкий и тёмный;
      снизу ничего не разглядеть. Нужен человек, готовый нырнуть.
    options:
      - id: wheel_dive
        label: Отправить добровольца
        requires: [player]
        description: Холодно, темно, но другого способа нет.
        outcomes:
          - chance: 60
            text: >-
              {chosen} нашёл затор — корень, намотавшийся на ось.
              Прочищено. Колесо снова вертится.
            effects:
              - { on: chosen, health: -10, sanity: 12 }
              - { on: others, health: 4, sanity: 8 }
              - { flag: { wheel_incident: true } }
          - text: >-
              {chosen} нырнул, но течение прижало к решётке. Вытащили, но поздно.
            effects:
              - { on: chosen, health: -45, sanity: -20 }
              - { on: chosen, status: { id: hypothermia, label: Переохлаждение, stat: health, value: -8, months: 2 } }
              - { on: others, health: -8, sanity: -15 }
              - { flag: { wheel_incident: true } }
      - id: wheel_manual
        label: Перейти на ручной насос
        description: Таскать воду вёдрами — тяжело, но живы будем.
        effects:
          - { on: all, health: -10, sanity: -10 }
          - { on: all, status: { id: water_hauling, label: Усталость от воды, stat: sanity, value: -4, months: 2 } }
          - { flag: { wheel_incident: true } }
        schedule:
          - { event: wheel_fixed_itself, in: 3, chance: 40 }
      - id: wheel_probe
        label: Попробовать шестом
        description: Не нырять — зацепить затор снаружи.
        outcomes:
          - chance: 25
            text: >-
              С третьей попытки шест зацепил что-то — рывок, и колесо снова
              завертелось.
            effects:
              - { on: all, health: 4, sanity: 8 }
              - { flag: { wheel_incident: true } }
          - text: Шест сломался, колесо стоит. Потеряли время — вода кончается.
            effects:
              - { on: all, health: -15, sanity: -12 }
              - { flag: { wheel_incident: true } }

  - id: wheel_fixed_itself
    type: flavor
    scheduled_only: true
    title: Колесо само пошло
    text: >-
      Поток наконец вымыл затор — колесо дёрнулось и закрутилось. Вода снова
      течёт. Судьба решила не добивать.
    effects:
      - { on: all, health: 5, sanity: 8 }
