# Найден забытый схрон: как поделить нежданную находку. Жадность и излишняя
# бережливость могут аукнуться.
events:
  - id: supply_cache
    type: choice
    weight: 1
    when:
      flag_unset: [supply_cache_found]
      min_players: 2
    participants:
      finder: {}
    vars:
      stash: "{старый окованный сундук|запылённый ларь с провизией|чей-то схрон|кованый короб с печатью}"
    title: Забытый сундук
    text: >-
      {finder} наткнулся на {event.stash} за сдвинутой каменной плитой. Снеди
      немало — но надо решить, как поделить находку, пока не начались споры.
    options:
      - id: share
        label: Разделить немедленно
        description: Всё в общий котёл — пока не начались споры.
        outcomes:
          - chance: 65
            text: "В сундуке не только снедь — на дне нашлась {item}, она пополнила бункер."
            effects:
              - { food: 180 }
              - { on: all, sanity: 8 }
              - { add_bunker_item: random }
              - { flag: { supply_cache_found: true } }
          - effects:
              - { food: 140 }
              - { on: all, sanity: -5 }
              - { flag: { supply_cache_found: true } }
      - id: stockpile
        label: Убрать в резерв
        description: Не трогать сейчас — пригодится в трудный час.
        effects:
          - { food: 220 }
          - { on: all, sanity: -2 }
          - { flag: { supply_cache_found: true } }
        schedule:
          - { event: cache_spoiled, in: 3, chance: 40 }
      - id: finder_decides
        label: Пусть нашедший решает
        description: "{finder} нашёл — его слово первое."
        outcomes:
          - chance: 40
            effects:
              - { food: 160 }
              - { on: finder, sanity: 8 }
              - { on: others, sanity: 4 }
              - { flag: { supply_cache_found: true } }
          - effects:
              - { food: 90 }
              - { on: finder, sanity: 10 }
              - { on: others, sanity: -7 }
              - { on: finder, status: { id: envied, label: Зависть соседей, stat: sanity, value: -3, months: 2 } }
              - { flag: { supply_cache_found: true } }

  - id: cache_spoiled
    type: flavor
    scheduled_only: true
    title: Резерв подвёл
    text: >-
      Когда до отложенного наконец добрались, половина {запасов отсырела|провизии
      заплесневела|солонины протухла}. Бережливость обернулась потерей.
    effects:
      - { food: "15%" }
      - { on: all, sanity: -4 }
