# Отказ рунных систем жизнеобеспечения: чинить или махнуть рукой. Брошенная без
# присмотра поломка дорастает до полного угасания рун.
events:
  - id: machinery_breakdown
    type: choice
    weight: 1
    when:
      min_month: 2
      min_players: 2
    participants:
      victim: {}
    vars:
      system: "{руны жизнеобеспечения|руны вентиляции|очищающие круги воздуха|рунный насос подачи воды}"
    title: Отказ рунных систем
    text: >-
      {event.system} погасли в недрах убежища, воздух становится спёртым. Можно
      перебрать запасы и найти того, кто разбирается в рунном деле, — или
      понадеяться на удачу.
    select:
      kinds: [item, profession]
      prompt_item: Перебрать запасы и снаряжение
      prompt_profession: Кто возьмётся за починку
    options:
      - id: repair
        label: Взяться за починку
        description: >-
          С нужным инструментом и мастером — почти наверняка. С чем-то одним — как
          повезёт. С пустыми руками — наугад.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: Руны в умелых руках — круги снова светятся ровно.
              effects:
                - { on: all, sanity: 6 }
                - { flag: { life_support_fixed: true } }
          some:
            - chance: 50
              text: Кое-как, но удалось снова разжечь руны.
              effects:
                - { on: all, sanity: 3 }
                - { flag: { life_support_fixed: true } }
            - text: Без нужного сочетания инструмента и знаний починка не задалась.
              effects:
                - { on: all, health: -8, sanity: -6 }
              schedule:
                - { event: system_collapse, in: 2, chance: 55 }
          none:
            - text: Голыми руками и наугад — стало только хуже.
              effects:
                - { on: all, health: -12, sanity: -8 }
              schedule:
                - { event: system_collapse, in: 2, chance: 70 }
      - id: ignore
        label: Не трогать
        description: Понадеяться, что обойдётся само.
        outcomes:
          - chance: 35
            text: Руны кое-как разгорелись сами.
            effects:
              - { on: all, sanity: -3 }
          - text: Без вмешательства стало совсем тяжело дышать.
            effects:
              - { on: all, health: -10, sanity: -6 }
            schedule:
              - { event: system_collapse, in: 2, chance: 60 }

  - id: system_collapse
    type: choice
    scheduled_only: true
    when:
      flag_unset: [life_support_fixed]
    title: Угасание рун
    text: >-
      Недочиненные руны погасли окончательно: свет мерцает, воздух густой и
      тяжёлый, вода еле сочится. Тянуть больше нельзя.
    select:
      kind: profession
      prompt_profession: Кто пойдёт к рунному ядру?
    options:
      - id: emergency_fix
        label: Спешная починка
        description: Послать умельца к рунному ядру, пока ещё есть чем дышать.
        requires: [profession]
        outcomes_by_selection:
          all:
            - text: Мастер вернул руны к жизни в последний момент.
              effects:
                - { on: all, sanity: 6 }
                - { flag: { life_support_fixed: true } }
          none:
            - chance: 35
              text: Кое-как, на одном упрямстве, руны удалось зажечь заново.
              effects:
                - { on: all, health: -6 }
                - { flag: { life_support_fixed: true } }
            - text: Без знатока рунное ядро не одолеть — убежище задыхается.
              effects:
                - { on: all, health: -16, sanity: -8 }
                - { on: random, kill: true }
      - id: evacuate_section
        label: Бросить отсек
        description: Запечатать мёртвую секцию и ужаться в живой части убежища.
        effects:
          - { on: all, sanity: -8, health: -6 }
