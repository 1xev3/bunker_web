id: crop_failure
title:
  - Повреждение теплицы
  - Гибнет урожай
  - Болезнь растений
description:
  - >-
    В нашей теплице начались проблемы: {alt.cause}, и часть {alt.crop} уже погибает.
    Как мы можем спасти урожай, пока не потеряли весь запас свежей еды?
  - >-
    Из-за {alt.cause_case} грядки с {alt.crop_case} выглядят всё хуже с каждым днём.
    Что мы предпримем, чтобы восстановить теплицу?
alt:
  - cause:
      - завелась плесень
      - сломалась система полива
      - растения поразили вредители
    cause_case:
      - плесени
      - сбоя в системе полива
      - нашествия вредителей
    crop:
      - грибов и зелени
      - корнеплодов
      - лекарственных трав
    crop_case:
      - грибами и зеленью
      - корнеплодами
      - лекарственными травами
base_chance: 0.20
success_effects:
  - type: food_change
    value: -10
failure_effects:
  - type: food_change
    value: -40
