id: rodent_infestation
title:
  - Нашествие крыс
  - Вредители в отсеках
  - Шорох в стенах
description:
  - >-
    В бункер проникли {alt.pests}: они уже грызут {alt.target} и разносят заразу.
    Как мы можем быстро избавиться от вредителей?
  - >-
    Из {alt.entry} полезли {alt.pests}, и теперь под угрозой {alt.target}.
    Чем мы остановим это нашествие, пока потери не стали серьёзными?
alt:
  - pests:
      - крысы
      - голодные грызуны
      - серые вредители
    target:
      - провода и мешки с едой
      - складские ящики и кабели
      - продукты и изоляцию на стенах
    entry:
      - вентиляционной шахты
      - узкой щели в стене
      - старого технического короба
base_chance: 0.20
success_effects:
  - type: food_change
    value: -10
failure_effects:
  - type: food_change
    value: -30
