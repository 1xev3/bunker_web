id: hidden_chamber
title:
  - Скрытый отсек
  - Тайная комната
  - За фальшивой стеной
description:
  - >-
    {explorer} нашёл дверь, замаскированную под обычную стену.
    За ней — нетронутый отсек с запасами. Удача наконец улыбнулась выжившим.
  - >-
    Исследуя {alt.area}, {explorer} обнаружил скрытое помещение.
    Внутри нетронуто. Находка подняла дух всего бункера.
alt:
  - area:
      - техническую нишу
      - старый склад
      - заброшенный коридор
participants:
  - role: explorer
success_effects:
  - type: survival_change
    value: 8
  - type: add_room
  - type: food_change
    value: 15
