# Вода в баке испортилась: очистить рунами, кипятить или пить как есть. Грязная
# вода тихо подтачивает здоровье всего убежища.
events:
  - id: water_contamination
    type: choice
    weight: 2
    when:
      min_month: 1
      min_players: 2
    vars:
      sign: "{мутной и бурой|с маслянистой плёнкой|с тухлым запахом|с ржавым осадком}"
    title: Порченая вода
    text: >-
      Вода в баке стала {event.sign}. Пить такую страшно, но другой нет.
      Можно пустить в дело очищающие руны и знающего человека, кое-как
      прокипятить — или пить как есть и молиться.
    select:
      kinds: [item, profession]
      prompt_item: Чем будем чистить воду?
      prompt_profession: Кто наладит очистку?
    options:
      - id: purify
        label: Очистить
        description: >-
          С рунным фильтром и знатоком — вода снова чистая. С чем-то одним — как
          выйдет. С пустыми руками — почти без толку.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: Воду прогнали через очищающие руны — снова можно пить без опаски.
              effects:
                - { on: all, sanity: 5 }
                - { flag: { water_clean: true } }
          some:
            - chance: 55
              text: Воду удалось довести до сносного состояния.
              effects:
                - { on: all, sanity: 2 }
                - { flag: { water_clean: true } }
            - text: Очистка вышла так себе — кое-кто всё равно слёг животом.
              effects:
                - { on: random, health: -8 }
              schedule:
                - { event: dysentery_outbreak, in: 1, chance: 45 }
          none:
            - text: Без рун и знаний воду не спасти — пить пришлось грязную.
              effects:
                - { on: all, health: -8 }
              schedule:
                - { event: dysentery_outbreak, in: 1, chance: 60 }
      - id: boil
        label: Просто кипятить
        description: Ничего не тратить, гонять воду над очагом — авось хватит.
        outcomes:
          - chance: 50
            text: Кипячёная вода горчит, но обходится без последствий.
            effects:
              - { on: all, sanity: -2 }
          - text: Кипячение не убило всю заразу — по убежищу пошли рези в животе.
            effects:
              - { on: all, health: -6 }
            schedule:
              - { event: dysentery_outbreak, in: 1, chance: 40 }

  - id: dysentery_outbreak
    type: choice
    scheduled_only: true
    when:
      flag_unset: [water_clean]
    title: Вспышка нутряной хвори
    text: >-
      Грязная вода сделала своё: половина убежища слегла с резью и жаром. Без
      снадобий самые слабые могут не дотянуть.
    select:
      kind: item
      prompt_item: Чем лечить больных?
    options:
      - id: treat
        label: Пустить снадобья
        description: Израсходовать запасы, чтобы поднять больных.
        requires: [item]
        consume_items: true
        effects:
          - { on: all, health: 6, clear_status: debuffs }
          - { on: all, sanity: 3 }
      - id: ride_it_out
        label: Перетерпеть
        description: Ничего не тратить — пусть хворь идёт своим чередом.
        outcomes:
          - chance: 45
            text: Убежище перемоглось, потеряв в силах, но без жертв.
            effects:
              - { on: all, health: -10 }
          - text: Самые ослабшие не выдержали обезвоживания.
            effects:
              - { on: random, kill: true }
              - { on: all, health: -8, sanity: -8 }
