# Спор из-за пайков: рассудить, замять или наказать. Затаённая обида не
# рассасывается — она тлеет и однажды вспыхивает.
events:
  - id: ration_dispute
    type: choice
    weight: 1
    when:
      min_players: 3
    participants:
      hoarder: {}
      accuser: {}
    title: Спор из-за пайков
    text: >-
      {accuser} в открытую обвиняет {hoarder} в том, что тот тайком берёт лишнее
      из общих запасов. Голоса всё {громче|злее|надрывнее}, убежище замерло в
      ожидании.
    options:
      - id: side_accuser
        label: Встать на сторону обвинителя
        description: Обыскать и пристыдить — порядок важнее.
        outcomes:
          - chance: 60
            text: Нашли заначку. Виновный пристыжён, остальные приободрились.
            effects:
              - { food: 80 }
              - { on: hoarder, health: -5, sanity: -15 }
              - { on: others, sanity: 6 }
              - { on: hoarder, status: { id: branded_thief, label: Клеймо вора, stat: sanity, value: -4, months: 3 } }
          - text: Ничего не нашли — пустое обвинение лишь раскололо людей.
            effects:
              - { on: all, health: -5, sanity: -10 }
            schedule:
              - { event: grudge_festers, in: 2, chance: 65, carry: [hoarder, accuser] }
      - id: hush
        label: Замять конфликт
        description: Не раздувать — всем сейчас и без того тяжело.
        effects:
          - { on: accuser, health: -5, sanity: -8 }
          - { on: hoarder, sanity: 4 }
          - { on: others, sanity: -4 }
        schedule:
          - { event: grudge_festers, in: 2, chance: 55, carry: [hoarder, accuser] }
      - id: punish_both
        label: Урезать паёк обоим
        description: Чтоб неповадно было склочничать — но это удар по двоим.
        effects:
          - { on: hoarder, health: -20, sanity: -12 }
          - { on: accuser, health: -20, sanity: -12 }
          - { on: all, sanity: -6 }

  - id: grudge_festers
    type: choice
    scheduled_only: true
    title: Старая обида
    text: >-
      Тот спор так и не забылся. {accuser} и {hoarder} снова сцепились — на этот
      раз с кулаками, и убежище раскололось надвое. Как погасить ссору?
    select:
      kind: profession
      prompt_profession: Кто разнимет и примирит?
    options:
      - id: mediate
        label: Примирить
        description: Найти того, кому оба поверят, и развести их по углам.
        requires: [profession]
        outcomes_by_selection:
          all:
            - text: Их усадили за один стол и заставили выговориться — вражда улеглась.
              effects:
                - { on: all, health: 4, sanity: 8 }
          none:
            - chance: 40
              text: Кое-как растащили, но мириться никто не стал.
              effects:
                - { on: accuser, health: -8, sanity: -8 }
                - { on: hoarder, health: -8, sanity: -8 }
                - { on: others, sanity: -5 }
            - text: Без посредника драка переросла в поножовщину — один не выживет.
              effects:
                - { on: hoarder, kill: true }
                - { on: accuser, health: -30, sanity: -20 }
                - { on: all, health: -5, sanity: -12 }
      - id: take_side
        label: Изгнать зачинщика
        description: Выставить одного из них из общей части — пусть остынет в одиночестве.
        effects:
          - { on: hoarder, health: -20, sanity: -18 }
          - { on: accuser, sanity: 6 }
          - { on: others, health: -5, sanity: -8 }
