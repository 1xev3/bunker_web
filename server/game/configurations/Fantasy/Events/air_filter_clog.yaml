id: air_filter_clog
title:
  - Засорение воздушного фильтра
  - Тяжёлый воздух
  - Сбой вентиляции
description:
  - >-
    Система вентиляции начала давать сбои из-за {alt.cause}, и воздух в бункере
    становится {alt.air_state}. Чем мы можем прочистить или заменить забившиеся фильтры?
  - >-
    Из вентиляционных решёток тянет {alt.sign}, а фильтры явно забиты {alt.cause}.
    Что мы используем, чтобы вернуть в отсеки нормальный воздух?
alt:
  - cause:
      - слоя пыли и плесени
      - скопившейся золы
      - мокрой грязи и мусора
    air_state:
      - спёртым и тяжёлым
      - затхлым и удушливым
      - влажным и неприятно тёплым
    sign:
      - затхлостью
      - пылью
      - сырой гарью
base_chance: 0.15
success_effects:
  - type: survival_change
    value: 10
failure_effects:
  - type: survival_change
    value: -20
