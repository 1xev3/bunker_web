# Незваные твари у запасов: вывести или махнуть рукой. Расплодившись, они
# не только жрут провизию, но и приносят заразу.
events:
  - id: rats_invasion
    type: choice
    weight: 1
    when:
      min_month: 1
    vars:
      animals: [крыс, гнуса, склизней, мелких бесов]
    title: Незваные твари
    text: >-
      Несколько {event.animals} пробрались в убежище и теперь шныряют у запасов.
      Если расплодятся — сожрут половину провизии и принесут заразу.
    select:
      kinds: [item, profession]
      prompt_item: Чем будем травить?
      prompt_profession: Кто возьмётся вывести их?
    options:
      - id: exterminate
        label: Вывести
        description: С нужным средством и умельцем — наверняка. Иначе как выйдет.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: Травля сработала — от {event.animals} не осталось и следа.
              effects:
                - { on: all, health: 4, sanity: 6 }
                - { flag: { vermin_cleared: true } }
          some:
            - chance: 55
              text: Большую часть {event.animals} удалось извести.
              effects:
                - { on: all, sanity: 3 }
            - text: Полумеры не помогли — запасы всё же подъели, кое-кто заразился.
              effects:
                - { food: "20%" }
                - { on: random, health: -10, sanity: -5 }
              schedule:
                - { event: vermin_plague, in: 2, chance: 50 }
          none:
            - text: Голыми руками с {event.animals} не справиться — провизия тает, люди болеют.
              effects:
                - { food: "30%" }
                - { on: all, health: -6, sanity: -6 }
              schedule:
                - { event: vermin_plague, in: 2, chance: 70 }
      - id: ignore
        label: Не обращать внимания
        description: Авось сами уйдут и не расплодятся.
        outcomes:
          - chance: 25
            text: Похоже, {event.animals} ушли дальше по ходам.
            effects:
              - { on: all, sanity: 2 }
          - text: За пару недель {event.animals} расплодились и сожрали часть припасов.
            effects:
              - { food: "25%" }
              - { on: random, health: -12, sanity: -6 }
              - { on: random, status: { id: vermin_sickness, label: Зараза, stat: health, value: -6, months: 2 } }
            schedule:
              - { event: vermin_plague, in: 2, chance: 70 }

  - id: vermin_plague
    type: choice
    scheduled_only: true
    when:
      flag_unset: [vermin_cleared]
    title: Твари принесли заразу
    text: >-
      Расплодившиеся твари притащили в убежище хворь: у нескольких человек жар,
      сыпь, рвота. Заражённый угол нужно вычистить, пока не слегли все.
    select:
      kind: profession
      prompt_profession: Кто проведёт очищение?
    options:
      - id: purge
        label: Выжечь заразу
        description: Поручить дело знающему человеку и навести порядок.
        requires: [profession]
        outcomes_by_selection:
          all:
            - text: Угол вычистили дочиста, больных отпоили — вспышку погасили.
              effects:
                - { on: all, health: 6, sanity: 6 }
                - { flag: { vermin_cleared: true } }
          none:
            - chance: 40
              text: Своими силами кое-как навели порядок, но пара человек ещё хворает.
              effects:
                - { on: random, health: -20, sanity: -8 }
                - { on: all, health: -6 }
            - text: Без знающего человека зараза расползлась дальше — убежище валится с ног.
              effects:
                - { kill_random: true }
                - { on: all, health: -20, sanity: -12 }
      - id: wait_out
        label: Переждать
        description: Изолировать больных и надеяться, что обойдётся.
        outcomes:
          - chance: 40
            text: Хворь сама отступила, потрепав, но не свалив убежище.
            effects:
              - { on: all, health: -12, sanity: -6 }
          - text: Вспышка разрослась — слегли почти все, кто-то не поднялся.
            effects:
              - { kill_random: true }
              - { on: all, health: -25, sanity: -15 }
