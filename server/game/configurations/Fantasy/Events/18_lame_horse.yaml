# Конь захромал — выбор: лечить с расходом предметов, забить или выпустить.
events:
  - id: lame_horse
    type: choice
    weight: 1
    when:
      flag_unset: [horse_incident]
    select:
      kind: item
      prompt_item: Выберите, чем лечить
    vars:
      horse: "{Верховая лошадь|Ездовой пони}"
    title: "{event.horse} захромал"
    text: >-
      {event.horse} не встаёт на правую ногу — похоже, надломилось копыто
      или потянул сухожилие. Без лечения животное будет мучиться.
      Запасов на долгое выхаживание может не хватить.
    options:
      - id: horse_treat
        label: Лечить
        description: Потратить перевязочный материал и время. Есть шанс поставить на ноги.
        requires: [item]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: Конь пошёл на поправку — через несколько дней снова в строю.
              effects:
                - { on: all, health: 5, sanity: 10 }
                - { flag: { horse_incident: true } }
          some:
            - chance: 55
              text: Поставили на ноги, но хромота осталась. Для тяжёлой работы уже не годен.
              effects:
                - { on: all, health: -5, sanity: -5 }
                - { flag: { horse_incident: true } }
            - text: Лечение не помогло — конь не поднялся. Пришлось добить.
              effects:
                - { on: all, health: -8, sanity: -15 }
                - { food: 60 }
                - { flag: { horse_incident: true } }
          none:
            - chance: 20
              text: Конь выжил сам — видимо, не так серьёзно.
              effects:
                - { on: all, sanity: 5 }
                - { flag: { horse_incident: true } }
            - text: Без помощи конь мучился трое суток и не поднялся.
              effects:
                - { on: all, health: -8, sanity: -18 }
                - { flag: { horse_incident: true } }
      - id: horse_slaughter
        label: Забить на мясо
        description: Жестоко, но практично — голодные рты важнее.
        effects:
          - { food: 200 }
          - { on: all, health: -5, sanity: -14 }
          - { flag: { horse_incident: true } }
      - id: horse_release
        label: Выпустить
        description: Открыть ворота — может, выживет снаружи.
        effects:
          - { on: all, health: -5, sanity: -8 }
          - { flag: { horse_incident: true } }
        schedule:
          - { event: horse_returns, in: 3, chance: 25 }

  - id: horse_returns
    type: flavor
    scheduled_only: true
    title: Конь вернулся
    text: >-
      У ворот раздалось знакомое ржание. {Верховая лошадь|Ездовой пони} стоит
      снаружи — хромает, но жив. Видимо, снаружи его ждало ещё меньше хорошего.
    effects:
      - { on: all, health: 5, sanity: 10 }
