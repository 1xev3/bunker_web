# Романтическая цепочка в духе night_together: тайные знаки внимания ->
# раскрытие поклонника (выбор реакции). Использует выдачу/возврат вещей.
events:
  - id: secret_gift
    type: flavor
    weight: 1
    when:
      min_players: 3
    participants:
      admirer: { min_age: 16 }
      beloved: { min_age: 16 }
    vars:
      token: "{засушенный цветок|выструганную фигурку|самодельный амулет|тёплый шарф}"
    title: Тайный поклонник
    text: >-
      Наутро {beloved} нашёл у своей лежанки {event.token} без подписи. Кто-то
      в убежище не решается сказать прямо — и оставляет знаки внимания, пока
      остальные делают вид, что не замечают.
    effects:
      - { on: beloved, sanity: 8, give_item: { category: valuables } }
      - { on: admirer, sanity: 4 }
    schedule:
      - { event: admirer_revealed, in: 1, chance: 70, carry: [admirer, beloved] }

  - id: admirer_revealed
    type: choice
    scheduled_only: true
    title: Поклонник раскрыт
    text: >-
      Стало ясно, что подарки оставлял {admirer}. Теперь {beloved} должен решить,
      как ответить — в тесноте убежища любой выбор будет на виду у всех.
    options:
      - id: accept
        label: Ответить взаимностью
        description: Признать, что внимание приятно.
        outcomes:
          - chance: 70
            text: Между {admirer} и {beloved} вспыхнуло тепло — на двоих стало легче нести это бремя.
            effects:
              - { on: admirer, sanity: 12 }
              - { on: beloved, sanity: 12 }
          - text: Признание вышло неловким — оба смутились и теперь сторонятся друг друга.
            effects:
              - { on: admirer, sanity: -6 }
              - { on: beloved, sanity: -4 }
      - id: return_gift
        label: Вернуть подарок
        description: Мягко дать понять, что взаимности не будет.
        effects:
          - { on: beloved, remove_item: random }
          - { on: admirer, sanity: -12 }
          - { on: admirer, status: { id: rejected, label: Отвергнут, stat: sanity, value: -3, months: 2 } }
      - id: stay_silent
        label: Сделать вид, что не понял
        description: Не отвечать вовсе — пусть всё останется недосказанным.
        effects:
          - { on: admirer, sanity: -6 }
          - { on: beloved, sanity: -3 }
          - { on: beloved, status: { id: awkward_silence, label: Неловкость, stat: sanity, value: -2, months: 2 } }
