# Эвент + цепочка нарративов
- id: fire_hazard
  title:
    - Возгорание в бункере
    - Пожар
    - Густой дым
  description:
    - >-
      В бункере вспыхнул небольшой пожар, а в замкнутом пространстве
      огонь и дым особенно опасны. Как мы можем немедленно потушить огонь,
      пока пожар не распространился?
    - >-
      Бункер затягивает густым дымом: загорелся {alt.source}.
      Что мы сделаем прямо сейчас, чтобы локализовать пожар?
  alt:
    - source:
        - кабельный жгут
        - стеллаж с припасами
        - ящик с горючими материалами
  base_chance: 0.05
  success_effects:
    - type: survival_change
      value: 15
  failure_effects:
    - type: survival_change
      value: -25
    - type: remove_room
    - type: kill_random_active
      chance: 0.5
  chain_success: fire_extinguished
  chain_failure: fire_devastation

- id: fire_extinguished
  event_type: narrative
  title: Огонь потушен
  description: >-
    Пожар ликвидирован. Отсек закопчён, но цел. Бункер устоял.
  success_effects: []

- id: fire_devastation
  event_type: narrative
  title: Отсек выгорел
  description: >-
    Пламя оказалось сильнее. Один из отсеков безвозвратно уничтожен.
    Всё, что там находилось, потеряно.
  success_effects: []
