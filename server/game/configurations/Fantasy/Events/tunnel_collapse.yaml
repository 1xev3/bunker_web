id: tunnel_collapse
title:
  - Обвал запасного тоннеля
  - Завален проход
  - Перекрыт запасной выход
description:
  - >-
    Запасной выход из бункера завален после {alt.cause},
    а под обломками остались {alt.blockage}.
    Как мы можем расчистить тоннель, чтобы не остаться без пути к отступлению?
  - >-
    После {alt.cause_case} тоннель к запасному выходу оказался перекрыт {alt.blockage_case}.
    Что мы используем, чтобы вернуть хотя бы один безопасный маршрут?
alt:
  - cause:
      - обрушения породы
      - просадки старой кладки
      - сильной вибрации в грунте
    cause_case:
      - обрушения породы
      - просадки кладки
      - сильной вибрации грунта
    blockage:
      - камни и балки
      - куски бетона и мусор
      - обломки креплений
    blockage_case:
      - камнями и балками
      - кусками бетона и мусором
      - обломками креплений
base_chance: 0.20
success_effects:
  - type: survival_change
    value: 10
failure_effects:
  - type: survival_change
    value: -15
  - type: remove_room
