# Кто-то тайно работает у алхимического стола: флейвор-открытие, потом выбор.
events:
  - id: alchemist_caught
    type: flavor
    weight: 2
    when:
      min_players: 3
      flag_unset: [alchemist_secret_resolved]
    participants:
      suspect: {}
    title: Запах из мастерской
    text: >-
      {suspect} уже несколько ночей пропадает у алхимического стола — запах
      кислого дыма тянется по коридорам. Когда его застали, не объяснил ничего:
      только прикрыл склянки рукой и попросил не смотреть.
    effects:
      - { on: all, health: -4, sanity: -5 }
    schedule:
      - { event: alchemist_reveal, in: 1, carry: [suspect] }

  - id: alchemist_reveal
    type: choice
    scheduled_only: true
    title: Что варит {suspect}?
    text: >-
      {suspect} наконец раскололся: он пытается синтезировать лечебное зелье —
      или что-то вроде того. Незаконченная формула и стол в ожогах говорят
      сами за себя. Что решат остальные?
    options:
      - id: alch_support
        label: Дать продолжить
        description: Пусть работает под наблюдением — вдруг и правда поможет.
        outcomes:
          - chance: 50
            text: Через несколько дней {suspect} принёс рабочее зелье. Всем полегчало.
            effects:
              - { on: all, health: 12, sanity: 8 }
              - { on: suspect, sanity: 18 }
              - { flag: { alchemist_secret_resolved: true } }
          - text: Эксперимент вышел из-под контроля — взрыв выжег мастерскую и зацепил соседей.
            effects:
              - { on: suspect, health: -35, sanity: -20 }
              - { on: all, health: -15, sanity: -10 }
              - { flag: { alchemist_secret_resolved: true } }
      - id: alch_confiscate
        label: Изъять реагенты
        description: Слишком опасно — забрать всё и запретить эксперименты.
        effects:
          - { on: suspect, health: -8, sanity: -25 }
          - { on: others, sanity: 5 }
          - { flag: { alchemist_secret_resolved: true } }
      - id: alch_collective
        label: Объявить всем
        description: Вынести на общее обсуждение — пусть решают вместе.
        outcomes:
          - chance: 55
            effects:
              - { on: all, health: 4, sanity: 6 }
              - { food: 30 }
              - { flag: { alchemist_secret_resolved: true } }
          - effects:
              - { on: all, sanity: -8 }
              - { on: suspect, sanity: -14 }
              - { flag: { alchemist_secret_resolved: true } }
