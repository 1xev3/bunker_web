id: illness_outbreak
title:
  - Вспышка болезни
  - Лихорадка среди выживших
  - Распространение заразы
description:
  - >-
    Несколько обитателей слегли с жаром и кашлем, а болезнь быстро
    распространяется в замкнутом пространстве. Как мы будем лечить заболевших
    и сдерживать заражение?
  - >-
    Началась вспышка {alt.symptom}, и всё больше людей чувствуют недомогание.
    Чем мы изолируем очаг и поможем пострадавшим?
alt:
  - symptom:
      - лихорадки
      - тяжёлого кашля
      - странной сыпи
base_chance: 0.10
participants_template: random_group
participants_min: 2
participants_max: 4
success_effects:
  - type: survival_change
    value: 15
failure_effects:
  - type: survival_change
    value: -20
  - type: kill_participant
    target: each_participant
    per_target_chance: 0.5
