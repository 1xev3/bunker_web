id: birthday_celebration
title:
  - День рождения
  - Маленький праздник
  - Повод улыбнуться
description:
  - >-
    {birthday_person} сегодня отмечает день рождения. Несмотря на тяжёлые
    обстоятельства, группа устроила небольшое торжество.
    Немного радости в этой тьме.
  - >-
    {birthday_person} дарит всем повод улыбнуться: самодельный праздник
    с {alt.detail} напомнил людям, что жизнь в бункере не состоит только из тревоги.
alt:
  - detail:
      - песней и тёплыми словами
      - импровизированным тортом из пайков
      - свечой и смешными историями
participants:
  - role: birthday_person
success_effects:
  - type: survival_change
    value: 3
