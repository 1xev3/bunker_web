# Твари осаждают ворота — отбиться арсеналом или запереться и молиться.
events:
  - id: monster_raid
    type: choice
    weight: 2
    when:
      min_players: 2
      min_month: 2
    participants:
      defender: {}
    vars:
      threat: "{стая клыкастых тварей|орда нежити|волчий прайд с магическим вожаком|рой скверненых насекомых}"
    title: "{event.threat} у ворот"
    text: >-
      {defender} поднял тревогу — {event.threat} добрался до ворот и ломится
      внутрь. Времени нет. Можно поднять всё годное для обороны и дать бой —
      или забиться в отсек и молиться, что не пролезут.
    select:
      kinds: [item, profession]
      prompt_item: Поднять оружие, ловушки и алхимию из запасов
      prompt_profession: Кто встанет в оборону
    options:
      - id: raid_fight
        label: Дать бой
        description: >-
          Луки, арбалеты, алхимические колбы, капканы, сети, руны от зверей —
          чем богаче арсенал и умелее защитник, тем меньше потерь.
        requires: [item, profession]
        consume_items: true
        outcomes_by_selection:
          all:
            - text: >-
                Отогнали с первого натиска — {defender} сегодня герой убежища.
                Твари оставили у ворот нескольких своих.
              effects:
                - { on: defender, health: 8, sanity: 22 }
                - { on: others, sanity: 12 }
          some:
            - chance: 55
              text: >-
                Отбились, но {defender} получил своё — бой вышел грязным.
                Ворота держат, но ненадёжно.
              effects:
                - { on: defender, health: -25, sanity: -10 }
                - { on: all, health: -8, sanity: -8 }
            - text: >-
                Арсенала или умения не хватило — твари прорвались во двор
                и похозяйничали в кладовой.
              effects:
                - { on: all, health: -20, sanity: -15 }
                - { food: "20%" }
                - { kill_random: true }
          none:
            - text: >-
                С голыми руками против такого не выстоять. Прорвались. Когда
                всё кончилось — не всех досчитались.
              effects:
                - { on: all, health: -30, sanity: -20 }
                - { food: "25%" }
                - { kill_random: true }
                - { kill_random: true }
      - id: raid_barricade
        label: Забаррикадироваться внутри
        description: Укрепить ворота и ждать. Может, уйдут сами — или найдут слабое место.
        outcomes:
          - chance: 50
            text: >-
              Ломились час и убрались — ворота оказались крепче, чем они
              рассчитывали.
            effects:
              - { on: all, health: -5, sanity: -12 }
          - text: >-
              Нашли слабое место и пролезли. Когда выбили — в крайнем отсеке
              уже некого было спасать.
            effects:
              - { on: all, health: -25, sanity: -18 }
              - { food: "15%" }
              - { kill_random: true }
